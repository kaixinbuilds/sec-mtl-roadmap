was read from the Author's Chair.","lm":[2],"u":"1A U1","r":"Revising a story after classmates' comments and questions","uid":"TL|G2|1|1A|1"}],"3":[{"t":"Water management: Revising a water story after classmates' comments","w":"3.11","y":"Students improve their story draft using the comments and questions raised when it was read from the Author's Chair.","lm":[2],"u":"1B U3","r":"Revising a water story after classmates' comments","uid":"TL|G2|1|1B|3"}]},"Relationships":{"2":[{"t":"Goals: Pairs asking each other why and how about qualities they like","w":"Activity 4.1","y":"One partner explains qualities they like and the other asks why and how, then pairs choose one they both like and show it to the class.","u":"1A U4","r":"Pairs asking each other why and how about qualities they like","uid":"TL|G2|1|1A|4"}],"3":[{"t":"The internet: Reflecting on how they help family members use technology","w":"Activity 2.1","y":"Students discuss which family members use technology and how they help grandparents or parents with it. Reflection through discussion only.","u":"1B U2","r":"Reflecting on how they help family members use technology","uid":"TL|G2|1|1B|2"}],"1":[{"t":"New beginnings: Class bingo matching classmates who gave the same answers","w":"1.1","y":"Students share their likes and thoughts with classmates, note who answered alike and discuss in pairs, getting to know the new class; this is a short opening activity.","lm":[1],"u":"1A U1","r":"Class bingo matching classmates who gave the same answers","uid":"TL|G2|1|1A|1"}]},"Health":{"2":[{"t":"Keeping healthy: Sharing own habits for staying healthy and why some skip them","w":"1.9","y":"Students share what they do to stay healthy and give reasons why some classmates do not follow healthy habits; discussion only, with no tracking or planning.","u":"1B U1","r":"Sharing own habits for staying healthy and why some skip them","uid":"TL|G2|1|1B|1"}]}},"full":[]},"TL|G2|2":{"terms":{"1":"Friendship · Hobbies · Protecting the environment · WA1","2":"Kings of Tamil Nadu · Yesterday, today, tomorrow · AA · Oral","3":"Financial literacy · Youth and society · WA3","4":"End-of-year preparation (first 2 weeks) · End-of-year exam"},"e21":{"CCI 3":{"1":[{"t":"Friendship: Fishbowl discussion of how to choose friends","w":"Activity 1.1","y":"An inner circle discusses questions with no set answer while the rest listen; those holding differing views swap in and put them to the group.","u":"2A U1","r":"Fishbowl discussion of how to choose friends","uid":"TL|G2|2|2A|1"}],"2":[{"t":"Newspaper article: Group drafting and peer editing","y":"Groups peer-edit the article together and share a single video presentation, taking in each other's suggestions to finish a common product. Evidence of disagreement handling is limited.","aa":true,"u":"Newspaper article","r":"Group drafting and peer editing"}]},"CAIT 3":{"1":[{"t":"Hobbies: Comparing a print newspaper report with an online one","w":"Activity 2.3","y":"Students compare news in a home newspaper with online news, note what is alike and different, and post these online, before writing their own report.","u":"2A U2","r":"Comparing a print newspaper report with an online one","uid":"TL|G2|2|2A|2"}],"2":[{"t":"Kings of Tamil Nadu: Comparing old kings' duties with monarchies today","w":"Activity 4.5","y":"As a lead-in to reading, students discuss what kings once had to do and compare it with monarchy in other countries now. Short, and not tied to a changed view.","u":"2A U4","r":"Comparing old kings' duties with monarchies today","uid":"TL|G2|2|2A|4"},{"t":"Yesterday, today, tomorrow: How living on the moon would differ from living on Earth","w":"Activity 1.2","y":"After reading, students discuss and share differences between life on the moon and on Earth. An imagined context; they do not go on to a changed approach.","u":"2B U1","r":"How living on the moon would differ from living on Earth","uid":"TL|G2|2|2B|1"}],"3":[{"t":"Financial literacy: Comparing old postal methods with present ones","w":"Activity 2.10","y":"Students discuss how past postal methods compare with those of today as a lead-in to writing an email. A short lead-in comparison.","u":"2B U2","r":"Comparing old postal methods with present ones","uid":"TL|G2|2|2B|2"}]},"CGC 1":{"1":[{"t":"Protecting the environment: Weighing why Singapore should become a city in nature","w":"Activity 3.6","y":"Students read Singapore's park plans before class, discuss what the government plans, and say whether the change is needed and what it gains. The guide tags civic literacy.","u":"2A U3","r":"Weighing why Singapore should become a city in nature","uid":"TL|G2|2|2A|3"},{"t":"Protecting the environment: Could Singapore face the same risk, and what can be done?","w":"Activity 3.2","y":"After reading about environmental risk, students say whether Singapore could face it, why, and what they and other countries can do. Whole-class questions.","u":"2A U3","r":"Could Singapore face the same risk, and what can be done?","uid":"TL|G2|2|2A|3"},{"t":"Protecting the environment: News on Singapore's old street traders and recyclers","w":"Activity 3.3","y":"Students may gather reports and pictures of past street traders and recycling collectors into a class display, then talk over how Singapore has changed.","u":"2A U3","r":"News on Singapore's old street traders and recyclers","uid":"TL|G2|2|2A|3"}],"2":[{"t":"Kings of Tamil Nadu: Explaining what Singapore's flag stands for","w":"Activity 4.2","y":"Students build on primary-school knowledge and work out what the colours, moon and stars on the flag represent. National identity, a single view; the guide names this goal.","u":"2A U4","r":"Explaining what Singapore's flag stands for","uid":"TL|G2|2|2A|4"}],"3":[{"t":"Youth and society: Taking opposing stances on whether youths should join community groups","w":"3.2","y":"In shark and dolphin groups students argue for or against youths joining community organisations; the guide aims for students to meet different viewpoints. Stances are assigned.","u":"2B U3","r":"Taking opposing stances on whether youths should join community groups","uid":"TL|G2|2|2B|3"},{"t":"Youth and society: Discussing news stories on youth helping the community","w":"3.3","y":"Groups choose a news report on youth solving community problems and discuss the problem and the solution.","u":"2B U3","r":"Discussing news stories on youth helping the community","uid":"TL|G2|2|2B|3"}]},"CAIT 4":{"2":[{"t":"Yesterday, today, tomorrow: Weighing solutions on a decision form and reaching their own","w":"Activity 1.4","y":"For a question from the reading, students list solutions, the gains and the problems to expect, then write their own decision and share the form with the class.","u":"2B U1","r":"Weighing solutions on a decision form and reaching their own","uid":"TL|G2|2|2B|1"}]},"CCI 1":{"1":[{"t":"Email reply: Giving advice to a friend who wrote about a problem","y":"Students read a friend's email about a situation and write a reply that gives advice and reasons. One-way writing to a named reader.","u":"Email reply","r":"Giving advice to a friend who wrote about a problem"},{"t":"Protecting the environment: Speaking as the forest, tree or sea to the class","w":"3.1","y":"Students take the role of a forest, tree or sea and tell the class why it matters and what harms it, then assess their own speaking. One way, aimed at classmates.","u":"2A U3","r":"Speaking as the forest, tree or sea to the class","uid":"TL|G2|2|2A|3"}],"2":[{"t":"Oral exam: Answering examiner questions on a video","y":"After a short video, students answer examiner questions: their reaction or experience, what they suggest, and whether they agree with a given view, giving reasons. Spoken, with the examiner.","u":"Oral exam","r":"Answering examiner questions on a video"},{"t":"Newspaper article and video: Telling a school community member's story","y":"Students interview a real person, then convey the story in a newspaper article and a recorded presentation for readers and viewers. Largely one-way presentation to an audience.","aa":true,"u":"Newspaper article and video","r":"Telling a school community member's story"},{"t":"Yesterday, today, tomorrow: Creating an online advertisement for a robot company","w":"1.9","y":"Students make an online ad for an imagined robot maker, choosing a title, buyer group, pictures and contact details to suit the audience. One way.","u":"2B U1","r":"Creating an online advertisement for a robot company","uid":"TL|G2|2|2B|1"}]},"CGC 2":{"3":[{"t":"Youth and society: Finding what other community organisations do to involve youth","w":"3.3","y":"Students find other Singapore community organisations and what each has done to bring in young people, then share. Partial: they list efforts rather than compare roles.","u":"2B U3","r":"Finding what other community organisations do to involve youth","uid":"TL|G2|2|2B|3"}]}},"ibl":{"Investigation":{"1":[{"t":"Protecting the environment: Gathering material on past street traders for a class display","w":"Activity 3.3","y":"Students look up recycling collectors online before class and may gather reports and pictures of such traders for a class display. A set topic.","u":"2A U3","r":"Gathering material on past street traders for a class display","uid":"TL|G2|2|2A|3"},{"t":"Hobbies: Finding online which hobbies did not exist in 1980s Singapore","w":"2.2","y":"Pairs compare their own hobbies with the pictures, search online for hobbies absent in 1980s Singapore, then share with classmates; a small, narrow search.","u":"2A U2","r":"Finding online which hobbies did not exist in 1980s Singapore","uid":"TL|G2|2|2A|2"}],"2":[{"t":"Interview: Finding out a school community member's story first-hand","y":"Students interview a real person live in Tamil, ask their own questions and make sense of the replies to build the article. They find out first-hand.","aa":true,"u":"Interview","r":"Finding out a school community member's story first-hand"},{"t":"Kings of Tamil Nadu: Searching online for missing facts about the Tamil kings","w":"4.1","y":"Students read up beforehand, discuss in groups, search online for facts that were missing, write them down and share with a partner.","u":"2A U4","r":"Searching online for missing facts about the Tamil kings","uid":"TL|G2|2|2A|4"},{"t":"Yesterday, today, tomorrow: Finding the source of a floppy disk image online","w":"1.1","y":"Students search online for the origin of the pictured floppy disk and use what they found to answer the textbook questions, then share with the class.","u":"2B U1","r":"Finding the source of a floppy disk image online","uid":"TL|G2|2|2B|1"}],"3":[{"t":"Youth and society: Researching community organisations and their youth efforts","w":"3.3","y":"Students look up other community organisations and their efforts to involve youth, using the news sites and videos, and share what they gathered.","u":"2B U3","r":"Researching community organisations and their youth efforts","uid":"TL|G2|2|2B|3"}]},"Conclusion":{"2":[{"t":"Video and reflection: Sharing the story found and reflecting on it","y":"Groups share what they found in a recorded presentation and write an individual reflection in class on the project.","aa":true,"u":"Video and reflection","r":"Sharing the story found and reflecting on it"}]},"Orientation":{"2":[{"t":"Yesterday, today, tomorrow: Tracing what came before a pictured object","w":"1.1","y":"Students are given a picture of a floppy disk and a puzzle about what existed before such objects and what comes next; the later search and drawing pursue it.","u":"2B U1","r":"Tracing what came before a pictured object","uid":"TL|G2|2|2B|1"}]}},"pos":{"Accomplishment":{"1":[{"t":"Friendship: Noting what they learnt and what more they want to learn","w":"Activity 1.12","y":"After each lesson or the unit, students record what they learnt and what else they want to learn in the textbook's reflection section.","u":"2A U1","r":"Noting what they learnt and what more they want to learn","uid":"TL|G2|2|2A|1"}],"2":[{"t":"Newspaper article: Drafting, peer editing and reflecting","y":"Groups draft the article, peer-edit it and revise before submission, then each writes an individual reflection on the work.","aa":true,"u":"Newspaper article","r":"Drafting, peer editing and reflecting"}]},"Purpose":{"3":[{"t":"Youth and society: Saying what community work they would like to do","w":"Activity 3.6","y":"Students share a news report showing care for the community, then discuss what such care means and what community service they themselves want to do.","lm":[4],"u":"2B U3","r":"Saying what community work they would like to do","uid":"TL|G2|2|2B|3"}]},"Engagement":{"2":[{"t":"Newspaper article: Choosing an interviewee and making an own product","y":"Groups choose their own interviewee from the school community and make a newspaper article and video that they own.","aa":true,"u":"Newspaper article","r":"Choosing an interviewee and making an own product"}]},"Relationships":{"1":[{"t":"Friendship: Telling a chosen friend a quality they like in them","w":"1.1","y":"Students name friends, pick one and tell them a quality they like, then talk about how they met and what they appreciate; this appreciating task is short.","lm":[1],"u":"2A U1","r":"Telling a chosen friend a quality they like in them","uid":"TL|G2|2|2A|1"}]}},"full":[]},"TL|G2|3":{"terms":{"1":"The arts · Me and my relationships · Leadership qualities · WA1","2":"Living in harmony with nature · The Tamil way of life · WA2 · Oral","3":"Mental well-being · Tamil and the world · AA","4":"End-of-year preparation (first 2 weeks) · End-of-year exam"},"e21":{"CGC 1":{"1":[{"t":"The arts: Giving a view on how Singapore values Tamil traditional arts","w":"Activity 1.4","y":"Students read a news report on street theatre in Singapore before class, then comment on the place given to Tamil arts here. A single issue; no tension of views is set.","u":"U1","r":"Giving a view on how Singapore values Tamil traditional arts","uid":"TL|G2|3||1"},{"t":"Me and my relationships: Why unity matters in a multiracial Singapore","w":"Activity 2.4","y":"After a listening task on a story about Singapore children, students discuss why people of many races here need to stay united. Partial at this level: discussion only.","u":"U2","r":"Why unity matters in a multiracial Singapore","uid":"TL|G2|3||2"}],"3":[{"t":"Mental well-being: Interviewing a parent, student and officer on student mental health","w":"Activity 6.3","y":"After news reports on Singapore's efforts, groups act as parent, student, government officer and reporter, swapping roles, so several sides are voiced. Role-play, not debate.","u":"U6","r":"Interviewing a parent, student and officer on student mental health","uid":"TL|G2|3||6"},{"t":"Debate: Arguing for or against a set question on culture in Singapore","y":"Students argue for or against a set question on culture in Singapore, with both sides heard. Partial at Level 4: the tension is aired, not worked through.","aa":true,"u":"Debate","r":"Arguing for or against a set question on culture in Singapore"}]},"CCI 2":{"1":[{"t":"Me and my relationships: Saying what they would do in a character's place","w":"Activity 2.2","y":"After reading a family dialogue, each student writes on the learning platform what they would do in the character's position. Taking a position in writing, not a live reply.","u":"U2","r":"Saying what they would do in a character's place","uid":"TL|G2|3||2"}],"3":[{"t":"Mental well-being: Answering in role as a parent, student or officer","w":"Activity 6.3","y":"In a three-step interview each student takes on another person's position on student mental health and answers a reporter, then roles swap.","u":"U6","r":"Answering in role as a parent, student or officer","uid":"TL|G2|3||6"},{"t":"Mental well-being: Hot seat as story characters, voicing their feelings","w":"Activity 6.9","y":"A student sits in role as a story character and speaks of joy, regret or anger over their actions while classmates question them, with each key character in turn.","u":"U6","r":"Hot seat as story characters, voicing their feelings","uid":"TL|G2|3||6"}]},"CAIT 3":{"1":[{"t":"Leadership qualities: How everyday speech differs from speaking on a stage","w":"Activity 3.9","y":"Before writing a speech, students discuss what is alike and different between ordinary talk and stage speaking, which shapes how they then write theirs.","u":"U3","r":"How everyday speech differs from speaking on a stage","uid":"TL|G2|3||3"}],"3":[{"t":"Tamil and the world: Comparing radio programmes with podcasts","w":"Activity 7.6","y":"Students listen to a Singapore radio programme, discuss Tamil broadcasts abroad, and talk about what is alike and different between radio and podcasts. Discussion only.","u":"U7","r":"Comparing radio programmes with podcasts","uid":"TL|G2|3||7"}]},"CCI 1":{"2":[{"t":"Oral exam: Answering examiner questions on a video","y":"After a short video, students answer examiner questions: their reaction or experience, what they suggest, and whether they agree with a given view, giving reasons. Spoken, with the examiner.","u":"Oral exam","r":"Answering examiner questions on a video"}],"4":[{"t":"Email: Replying to a friend, or writing in a role to a stated reader","y":"Students choose one email task: reply to a friend's email, or write in an imagined role to a stated reader for a set purpose. One-way writing for a set purpose and reader.","u":"Email","r":"Replying to a friend, or writing in a role to a stated reader"}],"3":[{"t":"Debate speech: Arguing a position with reasons and evidence","y":"Students prepare and deliver a debate speech of about 2 to 3 minutes with reasons and evidence, and rebut the other side. Spoken to a class audience.","aa":true,"u":"Debate speech","r":"Arguing a position with reasons and evidence"},{"t":"Mental well-being: Making encouraging e-stickers and judging which slogan is best","w":"6.1","y":"Students design e-sticker slogans for a given situation, show them, and groups discuss which is best and why before the class picks one.","u":"U6","r":"Making encouraging e-stickers and judging which slogan is best","uid":"TL|G2|3||6"}],"1":[{"t":"The arts: Recording podcast episodes on art works and friends' creations, with notes","w":"1.3, 1.12","y":"Students prepare short notes and record a series of podcast episodes, including talking about a friend's art work, then add a closing summary and upload. One way, aimed at listeners.","u":"U1","r":"Recording podcast episodes on art works and friends' creations, with notes","uid":"TL|G2|3||1"},{"t":"Me and my relationships: Debating a set motion with peer comments","w":"2.8","y":"Students learn debating skills from a video, prepare points and debate a set motion in groups, then classmates comment. The aim is persuading an audience.","u":"U2","r":"Debating a set motion with peer comments","uid":"TL|G2|3||2"},{"t":"Leadership qualities: Writing and giving a short speech, with classmates' comments","w":"3.9","y":"Students study sample speeches, write a short speech on a set topic and deliver or record it; classmates give comments. The audience and purpose are set.","u":"U3","r":"Writing and giving a short speech, with classmates' comments","uid":"TL|G2|3||3"}]},"CCI 3":{"1":[{"t":"Leadership qualities: Group choosing its leader and ranking leadership qualities","w":"3.1","y":"Groups discuss ten leadership qualities, decide among themselves who leads and which qualities matter most, and explain to the class why theirs outrank others. No conflict handling is described.","u":"U3","r":"Group choosing its leader and ranking leadership qualities","uid":"TL|G2|3||3"}]}},"ibl":{"Conceptualisation":{"1":[{"t":"Me and my relationships: Raising their own questions on family-relation words","w":"Activity 2.1","y":"Faced with relationship words, pairs say which are new, what questions arise for them and which they want to learn more about, before going on.","u":"U2","r":"Raising their own questions on family-relation words","uid":"TL|G2|3||2"}],"3":[{"t":"Mental well-being: Noting what they know and want to know about gardening for wellbeing","w":"6.2","y":"Before reading, students type what they already know and what they want to know about gardening for mental health; the teacher reads their questions first.","u":"U6","r":"Noting what they know and want to know about gardening for wellbeing","uid":"TL|G2|3||6"}]},"Investigation":{"1":[{"t":"The arts: Finding out about Singapore's well-known buildings","w":"Activity 1.8","y":"An optional add-on to the architecture reading: students find out about famous buildings in Singapore and what makes them special, then share in class.","u":"U1","r":"Finding out about Singapore's well-known buildings","uid":"TL|G2|3||1"}],"2":[{"t":"The Tamil way of life: Finding stories of people who rose from poverty","w":"Activity 5.6","y":"After reading a life story, students use their devices to search for similar stories of people who overcame poverty and share them in class.","u":"U5","r":"Finding stories of people who rose from poverty","uid":"TL|G2|3||5"},{"t":"Living in harmony with nature: Gathering facts on nature lovers and spots in Singapore","w":"4.2","y":"Students collect information on nature enthusiasts and on natural places in Singapore before class and share what they found with the class.","u":"U4","r":"Gathering facts on nature lovers and spots in Singapore","uid":"TL|G2|3||4"}]}},"pos":{"Emotions":{"3":[{"t":"Mental well-being: Discussing why gratitude matters, then thanking a charity by email","w":"Activity 6.10","y":"Students discuss why thanks matter and what it brings, pool in groups what to bear in mind when thanking someone, then write a formal thank-you email to a charity.","u":"U6","r":"Discussing why gratitude matters, then thanking a charity by email","uid":"TL|G2|3||6"}],"1":[{"t":"Me and my relationships: Naming feelings in family situations and rating how they felt","w":"2.9","y":"Students pick a feeling and situation from the wheels, tell an incident, and show with a finger poll how they felt after the activity, giving reasons.","u":"U2","r":"Naming feelings in family situations and rating how they felt","uid":"TL|G2|3||2"}]},"Engagement":{"1":[{"t":"The arts: Sharing own dance, music or drawings with the class","w":"1.1","y":"Students who learn dance, music or drawing prepare to show their own work or a recording, upload it, and classmates view it and respond with their views.","lm":[4],"u":"U1","r":"Sharing own dance, music or drawings with the class","uid":"TL|G2|3||1"}]},"Relationships":{"1":[{"t":"Me and my relationships: Turning a negative family situation into a positive one","w":"2.9","y":"Students spin wheels for a relationship, situation and feeling, share a real or imagined incident, and classmates help the sharer turn a negative situation positive.","lm":[1],"u":"U2","r":"Turning a negative family situation into a positive one","uid":"TL|G2|3||2"}]},"Accomplishment":{"2":[{"t":"Living in harmony with nature: Recording a commentary, self-assessing, getting feedback","w":"4.2","y":"Students give a live commentary on a nature scene, upload it, assess themselves against stated criteria and then receive written teacher feedback.","lm":[2],"u":"U4","r":"Recording a commentary, self-assessing, getting feedback","uid":"TL|G2|3||4"}]},"Health":{"3":[{"t":"Mental well-being: Discussing how tending plants affects feelings and mental health","w":"6.2","y":"Students bring photos of plants they grow, talk about feelings when tending plants and how that supports mental health, then make a brochure on gardening for mental well-being.","u":"U6","r":"Discussing how tending plants affects feelings and mental health","uid":"TL|G2|3||6"}]}},"full":[]},"TL|G2|4":{"terms":{"1":"Rights and duties · Traditions and customs · Nation-building · NWA1 · Oral","2":"Entrepreneurship  questions: their reaction or experience, what they suggest, and whether they agree with a given view, giving reasons. Spoken, with the examiner.","u":"Oral exam","r":"Answering examiner questions on a video"},{"t":"Newspaper article and video: Telling a school community member's story","y":"Students interview a real person, then convey the story in a newspaper article and a recorded presentation for readers and viewers. Largely one-way presentation to an audience.","aa":true,"u":"Newspaper article and video","r":"Telling a school community member's story"}]}},"ibl":{"Investigation":{"1":[{"t":"Protecting the environment: Finding out details of green events online","w":"Activity 3.8","y":"Before a class share, students use given links to find where, by whom and for whom events run in Singapore, then report. Teacher-set questions, so structured.","u":"2A U3","r":"Finding out details of green events online","uid":"TL|G1|2|2A|3"}],"2":[{"t":"Interview: Finding out a school community member's story first-hand","y":"Students interview a real person live in Tamil, ask their own questions and make sense of the replies to build the article. They find out first-hand.","aa":true,"u":"Interview","r":"Finding out a school community member's story first-hand"}]},"Conclusion":{"2":[{"t":"Video and reflection: Sharing the story found and reflecting on it","y":"Groups share what they found in a recorded presentation and write an individual reflection in class on the project.","aa":true,"u":"Video and reflection","r":"Sharing the story found and reflecting on it"}]},"Conceptualisation":{"1":[{"t":"Protecting the environment: Think, Puzzle, Explore on trees and rain","w":"Activity 3.1","y":"Students say what they know about trees, pose their own questions about trees and the environment, and suggest how they could find out more.","u":"2A U3","r":"Think, Puzzle, Explore on trees and rain","uid":"TL|G1|2|2A|3"}],"2":[{"t":"Yesterday, today, tomorrow: Know and want-to-know chart on a ne ents discuss which lost item would hurt most, name the feelings tied to loss and share ways of coping, while respecting classmates' feelings.","u":"U6","r":"Naming feelings about losing something and ways to cope","uid":"TL|G1|3||6"}]},"Health":{"3":[{"t":"Mental well-being: Using the five senses to settle stress and sharing their experience","w":"Activity 6.2","y":"Students try a five-senses activity to calm worry or low mood, then share what worked for them.","u":"U6","r":"Using the five senses to settle stress and sharing their experience","uid":"TL|G1|3||6"},{"t":"Mental well-being: Checking whether their day has time for exercise, rest and family","w":"Activity 6.3","y":"Students describe how they spend a day and say whether they set aside time for exercise, hobbies, family and sleep.","u":"U6","r":"Checking whether their day has time for exercise, rest and family","uid":"TL|G1|3||6"}]}},"full":[]},"TL|G1|4":{"terms":{"1":"Rights and duties · Traditions and customs · Nation-building · NWA1 · Oral","2":"Entrepreneurship · Creation and progress · A brand-new Earth · Timed practice","3":"SEC oral · Prelim · Revision","4":"SEC written papers"},"e21":{"CAIT 3":{"1":[{"t":"Traditions and customs: How interview questions change with the person interviewed","w":"Activity 2.10","y":"Groups discuss how questions differed for a speaker and for students in a news clip, then write interview questions for a news item and may act it out. Partial at Level 4.","u":"U2","r":"How interview questions change with the person interviewed","uid":"TL|G1|4||2"},{"t":"Nation-building: Singapore's transport and National Service, then and now","w":"Activity 3.1","y":"Students discuss both services past and present, why they began and how they improved. The guide prints this comparison goal; it stays a discussion, so partial at Level 4.","u":"U3","r":"Singapore's transport and National Service, then and now","uid":"TL|G1|4||3"}],"2":[{"t":"Entrepreneurship: Comparing two entrepreneurs in threes","w":"Activity 4.3","y":"Groups of three discuss what is alike and different between two entrepreneurs in a text and report to the class. New insight is left to the teacher, so partial at Level 4.","u":"U4","r":"Comparing two entrepreneurs in threes","uid":"TL|G1|4||4"}]},"CCI 1":{"1":[{"t":"Nation-building: Travel brochure on a Singapore attraction, revised after peer review","w":"Activity 3.5","y":"Students write brochure content for a set situation, a partner comments on the sentences, and they improve it and type it up. One way, with a peer review step.","u":"U3","r":"Travel brochure on a Singapore attraction, revised after peer review","uid":"TL|G1|4||3"},{"t":"Oral exam: Answering examiner questions on a video in SEC format","y":"After viewing a video, students take part in a discussion with examiners: sharing an experience, suggesting ways forward, and giving a view with reasons. Spoken, with the examiner.","u":"Oral exam","r":"Answering examiner questions on a video in SEC format"},{"t":"Rights and duties: Role-playing a job interview and writing preparation notes","w":"Activity 1.6","y":"In pairs, one student interviews and one answers appropriately; they then write notes on preparing for an interview, and peers comment. Practice for a set purpose.","u":"U1","r":"Role-playing a job interview and writing preparation notes","uid":"TL|G1|4||1"},{"t":"Traditions and customs: Writing questions and role-playing an interview","w":"Activity 2.10","y":"Students write reporter questions from a news item on a food festival, role-play the interview, and get teacher comments on question structure.","u":"U2","r":"Writing questions and role-playing an interview","uid":"TL|G1|4||2"}],"2":[{"t":"Entrepreneurship: Writing a CV and a covering email to an employer","w":"Activity 4.9","y":"Students fill in a CV form with their details and learn to attach it to an official email. One way writing for an employer.","u":"U4","r":"Writing a CV and a covering email to an employe ic character's traits","w":"Integrated task","y":"Students look up a Four Classics character to understand their traits before imagining a modern resume for them.","u":"U2","r":"Searching online for a classic character's traits","uid":"CL|G3|4||2"},{"t":"Unit 3: Searching and interviewing about wildlife nuisance","w":"Integrated task","y":"Students search online for wildlife that troubles residents and may interview classmates and family about how they feel.","u":"U3","r":"Searching and interviewing about wildlife nuisance","uid":"CL|G3|4||3"}],"2":[{"t":"Unit 4: Collecting information on a Singapore achievement","w":"Integrated task","y":"Students choose a Singapore success, gather information on it using the guide's tips and pick an angle for their report.","u":"U4","r":"Collecting information on a Singapore achievement","uid":"CL|G3|4||4"}]},"Conclusion":{"1":[{"t":"Unit 1: Sharing infographics and suggesting ways to help","w":"Integrated task","y":"Groups post their infographics and other groups exchange suggestions on helping the groups shown.","u":"U1","r":"Sharing infographics and suggesting ways to help","uid":"CL|G3|4||1"},{"t":"Unit 3: Presenting news videos and taking questions","w":"Integrated task","y":"Groups show their news video to the class, who ask questions and give comments on the spot or online.","u":"U3","r":"Presenting news videos and taking questions","uid":"CL|G3|4||3"}],"2":[{"t":"Unit 4: Peer evaluation of oral reports against a shared rubric","w":"Integrated task","y":"Classmates rate each oral report using the rubric the class made, and the teacher adds improvement tips.","u":"U4","r":"Peer evaluation of oral reports against a shared rubric","uid":"CL|G3|4||4"}]}},"pos":{"Purpose":{"1":[{"t":"Unit 3: Pledging their own action for ecological balance","y":"Students reflect on the part they can play in protecting ecological balance and write what they are willing to do.","u":"U3","r":"Pledging their own action for ecological balance","uid": g pass with dream and preparation steps","w":"Integrated task","y":"Students state a dream, an inspiring example and what they must prepare to reach it, then share the plan with the class.","lm":[3],"u":"U5","r":"Writing a boarding pass with dream and preparation steps","uid":"CL|G3|4||5"}]}},"full":[]},"TL|H|1":{"terms":{"1":"New experiences · Harvest festival · Tamil and me · WA1","2":"Goals · Keeping healthy · WA2 · Oral","3":"The internet · Water management · AA","4":"End-of-year preparation (first 2 weeks) · End-of-year exam"},"e21":{"CAIT 3":{"1":[{"t":"New experiences: Comparing primary and secondary school challenges","w":"Activity 1.8","y":"Students compare challenges met in primary school with those they expect at secondary, and discuss the unease a new setting brings. A brief discussion.","u":"1A U1","r":"Comparing primary and secondary school challenges","uid":"TL|H|1|1A|1"}],"2":[{"t":"Goals: Why different roles need different qualities","w":"Activity 4.1","y":"Students rank the qualities a soldier, actress or shopkeeper needs and say why, then share their own top five and see that priorities shift with each person's goals.","u":"1A U4","r":"Why different roles need different qualities","uid":"TL|H|1|1A|4"}],"3":[{"t":"Water management: Linking Marina Barrage and an ancient Tamil dam","w":"Activity 3.4","y":"Students link words such as old, new, king and government to pictures of the two dams, and talk about what has changed between then and now.","u":"1B U3","r":"Linking Marina Barrage and an ancient Tamil dam","uid":"TL|H|1|1B|3"}]},"CAIT 4":{"1":[{"t":"New experiences: Inventing a new CCA using SCAMPER","w":"Activity 1.11","y":"Groups use the SCAMPER prompts to invent an engaging new school activity, set out its name, participants and process, then improve it after classmates question it.","u":"1A U1","r":"Inventing a new CCA using SCAMPER","uid":"TL|H|1|1A|1"}],"2":[{"t":"Goals: Hot-seat solutions to problems shown in short dramas","w":"Activity 4.4","y":"After short dramas, students write and defend ways to solve each problem while others question them. The guide expects answers to vary with the situation.","u":"1A U4","r":"Hot-seat solutions to problems shown in short dramas","uid":"TL|H|1|1A|4"}],"3":[{"t":"The internet: Using technology to rescue a struggling fruit shop","w":"Activity 2.3","y":"Groups brainstorm how technology could change a fruit shop facing rivals and higher rent, merge their ideas and present a mind map. Applying the reading to a new problem.","u":"1B U2","r":"Using technology to rescue a struggling fruit shop","uid":"TL|H|1|1B|2"}]},"CCI 3":{"1":[{"t":"Tamil and me: Groups hearing every view, then settling the main ideas","w":"Activity 3.2","y":"The group leader asks each member for a view and reason on each paragraph; the group then talks it through and decides one list, which is compared with other groups.","u":"1A U3","r":"Groups hearing every view, then settling the main ideas","uid":"TL|H|1|1A|3"},{"t":"Tamil and me: Deciding a group message and how to present it","w":"Activity 3.5","y":"Groups choose together which main idea to stress and discuss how to express it as a short creative piece, then prepare it.","u":"1A U3","r":"Deciding a group message and how to present it","uid":"TL|H|1|1A|3"}],"3":[{"t":"The internet: Group mind map on a technology-changed fruit shop","w":"Activity 2.3","y":"Groups brainstorm, merge ideas into one list, build a mind map and present it. Only the shared product is described, not any handling of disagreement.","u":"1B U2","r":"Group mind map on a technology-changed fruit shop","uid":"TL|H|1|1B|2"}]},"CGC 1":{"1":[{"t":"Tamil and me: How aware Singapore Tamils are of language topics","w":"Activity 3.3","y":"Groups discuss set topics on Tamil and consider how aware people of Tamil background in Singapore are of them. An identity issue; views come from classmates only.","u":"1A U3","r":"How aware Singapore Tamils are of language topics","uid":"TL|H|1|1A|3"},{"t":"Harvest festival: Should Pongal be celebrated in Singapore?","w":"Activity 2.1","y":"In growing groups students share views on why Pongal is celebrated, how Singaporeans celebrate it and whether it must be celebrated here, a culture issue with differing views.","u":"1A U2","r":"Should Pongal be celebrated in Singapore?","uid":"TL|H|1|1A|2"}],"3":[{"t":"Water management: Explaining Singapore's water-saving efforts","w":"Activity 3.2","y":"Students prepare and give a talk on what the Singapore government does to save water and how technology helps. The guide tags this unit for civic literacy.","u":"1B U3","r":"Explaining Singapore's water-saving efforts","uid":"TL|H|1|1B|3"}]},"CCI 1":{"2":[{"t":"Email reply: Replying to a friend's email for set purposes","y":"Students read a friend's email and write a reply covering each purpose set, such as offering a view or advice, in a friendly register. One-way writing to a named reader.","u":"Email reply","r":"Replying to a friend's email for set purposes"},{"t":"Oral exam: Discussing a video topic with examiners","y":"Students answer two examiner questions after a video: why a common problem arises and what they suggest, giving reasons. Spoken, with the examiner.","u":"Oral exam","r":"Discussing a video topic with examiners"},{"t":"Goals: Debating a life-skills topic for and against","w":"Activity 4.3","y":"Each student writes points for both sides, two groups pool their side and choose members, then the class debates a life-skills topic.","u":"1A U4","r":"Debating a life-skills topic for and against","uid":"TL|H|1|1A|4"}],"3":[{"t":"Slide presentation: Giving reasons, benefits and a challenge on a set topic","y":"Students prepare 4 to 5 slides and notes on a set topic, covering reasons, benefits and a challenge, and present to the class. One-way presentation.","aa":true,"u":"Slide presentation","r":"Giving reasons, benefits and a challenge on a set topic"}],"1":[{"t":"New experiences: Pitching a co-curricular activity to classmates","w":"Activity 1.2","y":"Students prepare reasons for a CCA they recommend, then try to win other groups over to it. Mainly persuasion aimed at an audience, with peers responding.","u":"1A U1","r":"Pitching a co-curricular activity to classmates","uid":"TL|H|1|1A|1"},{"t":"New experiences: Presenting a new CCA designed with SCAMPER","w":"Activity 1.11","y":"Groups describe the new activity they designed, name, participants, process and what makes it engaging, to the class, who comment and ask questions.","u":"1A U1","r":"Presenting a new CCA designed with SCAMPER","uid":"TL|H|1|1A|1"},{"t":"Harvest festival: Pooling Pongal views and reporting to class","w":"Activity 2.1","y":"Each group combines what it discussed on three questions about Pongal and shares it clearly with the class.","u":"1A U2","r":"Pooling Pongal views and reporting to class","uid":"TL|H|1|1A|2"}]}},"ibl":{"Investigation":{"2":[{"t":"Keeping healthy: Polling schoolmates on canteen food","w":"Activity 1.3","y":"Before the lesson, students may build a poll or feedback form on school canteen food and find out what other students think. Optional in the guide.","u":"1B U1","r":"Polling schoolmates on canteen food","uid":"TL|H|1|1B|1"}],"3":[{"t":"The internet: Collecting facts on how computers changed","w":"Activity 2.6","y":"Before the lesson students gather facts on the invention of computers, tie them to pictures in class, then upload them for classmates to comment on. Teacher-set topic.","u":"1B U2","r":"Collecting facts on how computers changed","uid":"TL|H|1|1B|2"},{"t":"Water management: Asking elders about rivers and ponds of the past","w":"Activity 3.4","y":"Students look up how the Singapore River changed, ask older family members what rivers and ponds were like, take notes and share the findings in class.","u":"1B U3","r":"Asking elders about rivers and ponds of the past","uid":"TL|H|1|1B|3"}],"1":[{"t":"Harvest festival: Researching harvest festivals in other countries","w":"Activity 2.7","y":"Groups search the web for countries that hold harvest festivals, choose two outside Tamil Nadu and find out how each celebrates, then use it in a brochure.","u":"1A U2","r":"Researching harvest festivals in other countries","uid":"TL|H|1|1A|2"}]},"Conclusion":{"1":[{"t":"Harvest festival: Presenting the brochure and hearing peer comments","w":"Activity 2.7","y":"Groups present the brochure built from their findings and other groups give comments, before the teacher assesses it.","u":"1A U2","r":"Presenting the brochure and hearing peer comments","uid":"TL|H|1|1A|2"}]},"Conceptualisation":{"1":[{"t":"Tamil and me: Know and want-to-know form before the unit","w":"Activity 3.1","y":"Students fill in a form on what they already know and what they want to know about Tamil, to be completed later with what they learned.","u":"1A U3","r":"Know and want-to-know form before the unit","uid":"TL|H|1|1A|3"}]}},"pos":{"Health":{"2":[{"t":"Keeping healthy: Examining family food habits and making a healthy recipe","w":"Activity 1.3","y":"Students talk about what their families eat and how often they eat out, then prepare a healthy recipe and share it, giving reasons when choosing the best.","u":"1B U1","r":"Examining family food habits and making a healthy recipe","uid":"TL|H|1|1B|1"}]},"Relationships":{"3":[{"t":"The internet: Drawing quiet members in during group problem solving","w":"Activity 2.5","y":"In a group discussion on a problem, the leader gives everyone a turn, stops anyone dominating and encourages those who stay silent to speak.","u":"1B U2","r":"Drawing quiet members in during group problem solving","uid":"TL|H|1|1B|2"}],"1":[{"t":"Tamil and me: Taking turns and listening without interrupting","w":"Activity 3.3","y":"In group brainstorming on Tamil, each member must get a turn and others listen closely without cutting in or countering.","lm":[1],"u":"1A U3","r":"Taking turns and listening without interrupting","uid":"TL|H|1|1A|3"}]},"Engagement":{"1":[{"t":"New experiences: Making their own new school activity","w":"Activity 1.11","y":"Groups create their own CCA from games they like, explain what makes it engaging and may try it out in class or on the field. They own the product.","u":"1A U1","r":"Making their own new school activity","uid":"TL|H|1|1A|1"}]},"Accomplishment":{"3":[{"t":"Slide presentation: Describing a challenge met and how it was overcome","y":"Students describe a challenge they met and how they overcame it, reflecting on what their own experience taught them.","aa":true,"u":"Slide presentation","r":"Describing a challenge met and how it was overcome"}],"1":[{"t":"New experiences: Improving a group-designed CCA after peer questions","w":"Activity 1.11","y":"After classmates comment and ask questions about the CCA their group invented, the group revises its activity.","lm":[2],"u":"1A U1","r":"Improving a group-designed CCA after peer questions","uid":"TL|H|1|1A|1"}]}},"full":[]},"TL|H|2":{"terms":{"1":"Friendship · Hobbies · Protecting the environment · WA1","2":"Cultural norms and values · Yesterday, today, tomorrow · AA · Oral","3":"Financial literacy · Youth and society · WA3","4":"End-of-year preparation (first 2 weeks) · End-of-year exam"},"e21":{"CCI 2":{"1":[{"t":"Friendship: Taking on story characters to talk with the writer","w":"Activity 1.10","y":"After analysing a short story, students take the role of its characters and discuss it with the writer, speaking from the character's position.","u":"2A U1","r":"Taking on story characters to talk with the writer","uid":"TL|H|2|2A|1"}]},"CAIT 3":{"1":[{"t":"Hobbies: How playing with others differs from playing at home","w":"Activity 2.1","y":"Students decide which games they would change and why, and work out how playing with people, with objects or outdoors differs from playing indoors alone.","u":"2A U2","r":"How playing with others differs from playing at home","uid":"TL|H|2|2A|2"}],"2":[{"t":"Cultural norms and values: Monarchs of the past and today","w":"Appendix 1","y":"In an extra activity, students identify present-day monarchs and their countries, then discuss what is alike and different between them and kings of the past.","u":"2A U4","r":"Monarchs of the past and today","uid":"TL|H|2|2A|4"},{"t":"Yesterday, today, tomorrow: Same and different in family photos across time","w":"Activity 1.1","y":"Each student picks two family photos, names what is alike and different, then discusses what family photos may look like in future.","u":"2B U1","r":"Same and different in family photos across time","uid":"TL|H|2|2B|1"}]},"CCI 3":{"1":[{"t":"Hobbies: Discussing with set moves for adding to and differing from peers","w":"Activity 2.2","y":"Students discuss views on three young people, using set moves: praising a sound view, strengthening another person's point and differing politely where fitting.","u":"2A U2","r":"Discussing with set moves for adding to and differing from peers","uid":"TL|H|2|2A|2"}],"2":[{"t":"Newspaper article: Group drafting and peer editing","y":"Groups peer-edit the article together and share a single video presentation, taking in each other's suggestions to finish a common product. Evidence of disagreement handling is limited.","aa":true,"u":"Newspaper article","r":"Group drafting and peer editing"}]},"CGC 1":{"1":[{"t":"Protecting the environment: How Singapore's growth changed its streets and trades","w":"Activity 3.5","y":"After looking at old street vendors in Singapore, students discuss the many changes that national development has brought. One account; no sharper contrast is set.","u":"2A U3","r":"How Singapore's growth changed its streets and trades","uid":"TL|H|2|2A|3"}],"3":[{"t":"Youth and society: Views on young people serving the community","w":"Activities 3.1, 3.3","y":"Students discuss what good deeds young people do in society and the values shown, read a news item on a young volunteer and post their views. Views are not contrasted.","u":"2B U3","r":"Views on young people serving the community","uid":"TL|H|2|2B|3"}]},"CGC 2":{"2":[{"t":"Cultural norms and values: Sorting court and parliament roles and their duties","w":"Activity 4.1","y":"Students sort office holders into royal court or parliament, such as prime minister or opposition leader, and discuss each one's duties. Civic roles only; nothing is organised.","u":"2A U4","r":"Sorting court and parliament roles and their duties","uid":"TL|H|2|2A|4"}]},"CCI 1":{"2":[{"t":"Oral exam: Planned response then discussion with examiners","y":"Students prepare a response to a prompt and video, present it, then take examiner questions asking them to explain reasons and give examples. Spoken, with the examiner.","u":"Oral exam","r":"Planned response then discussion with examiners"},{"t":"Newspaper article and video: Telling a school community member's story","y":"Students interview a real person, then convey the story in a newspaper article and a recorded presentation for readers and viewers. Largely one-way presentation to an audience.","aa":true,"u":"Newspaper article and video","r":"Telling a school community member's story"}],"4":[{"t":"Email or forum post: Writing in a role after weighing three views","y":"Students choose a role-based email, or a forum post that weighs three given views and recommends actions with benefits. One-way writing for a stated reader.","u":"Email or forum post","r":"Writing in a role after weighing three views"}],"1":[{"t":"Friendship: Making a video about International Friendship Day","w":"Activity 1.9","y":"Students gather facts, plan and draft a video, upload it and comment on a partner's video. Partly two-way through the peer comments.","u":"2A U1","r":"Making a video about International Friendship Day","uid":"TL|H|2|2A|1"},{"t":"Protecting the environment: Formal email to join a beach clean-up","w":"Activity 3.10","y":"Students discuss why they want to volunteer, then write a respectful, direct formal email to a school or other leader. One-way writing for a set audience.","u":"2A U3","r":"Formal email to join a beach clean-up","uid":"TL|H|2|2A|3"}],"3":[{"t":"Financial literacy: Email requesting funds for a school activity","w":"Activity 2.12","y":"After sharing their own VIA experiences, students write a formal email asking for financial support. One-way writing for a set audience and purpose.","u":"2B U2","r":"Email requesting funds for a school activity","uid":"TL|H|2|2B|2"},{"t":"Youth and society: Writing a report on a school event","w":"Activity 3.12","y":"Students fix the report's purpose and reader, pick key facts from collected data and write a concise report. One-way writing.","u":"2B U3","r":"Writing a report on a school event","uid":"TL|H|2|2B|3"}]}},"ibl":{"Investigation":{"1":[{"t":"Hobbies: Interviewing a classmate for a news item","w":"Activity 2.11","y":"Students talk to a classmate, gather details of the classmate's hobby, and write it up as a short news report. Encouraged rather than required by the guide.","u":"2A U2","r":"Interviewing a classmate for a news item","uid":"TL|H|2|2A|2"},{"t":"Protecting the environment: Collecting facts and pictures on Singapore's old vendors","w":"Activity 3.5","y":"Students may gather stories and pictures of street vendors they have never seen in Singapore, building up material for a class display.","u":"2A U3","r":"Collecting facts and pictures on Singapore's old vendors","uid":"TL|H|2|2A|3"}],"2":[{"t":"Interview: Finding out a school community member's story first-hand","y":"Students interview a real person live in Tamil, ask their own questions and make sense of the replies to build the article. They find out first-hand.","aa":true,"u":"Interview","r":"Finding out a school community member's story first-hand"}]},"Conclusion":{"1":[{"t":"Protecting the environment: Class exhibition of what they found","w":"Activity 3.5","y":"Students show what they collected on old vendors as a class exhibition, which other Tamil classes may also visit. Optional in the guide.","u":"2A U3","r":"Class exhibition of what they found","uid":"TL|H|2|2A|3"}],"2":[{"t":"Video and reflection: Sharing the story found and reflecting on it","y":"Groups share what they found in a recorded presentation and write an individual reflection in class on the project.","aa":true,"u":"Video and reflection","r":"Sharing the story found and reflecting on it"}]}},"pos":{"Relationships":{"1":[{"t":"Friendship: Giving every member a fair turn in group talk","w":"Activity 1.2","y":"In group discussion on friendship, the leader makes sure each person gets a chance to speak while the others listen.","u":"2A U1","r":"Giving every member a fair turn in group talk","uid":"TL|H|2|2A|1"}]},"Engagement":{"3":[{"t":"Youth and society: Making a video about a skill they have","w":"Activity 3.1","y":"After identifying the skills they already have, students make a video about one of them and upload it, so the topic and product are their own.","u":"2B U3","r":"Making a video about a skill they have","uid":"TL|H|2|2B|3"}],"2":[{"t":"Newspaper article: Choosing an interviewee and making an own product","y":"Groups choose their own interviewee from the school community and make a newspaper article and video that they own.","aa":true,"u":"Newspaper article","r":"Choosing an interviewee and making an own product"}]},"Accomplishment":{"2":[{"t":"Newspaper article: Drafting, peer editing and reflecting","y":"Groups draft the article, peer-edit it and revise before submission, then each writes an individual reflection on the work.","aa":true,"u":"Newspaper article","r":"Drafting, peer editing and reflecting"}],"3":[{"t":"Youth and society: Skills I want to develop and why","w":"Activity 3.1","y":"Students mark skills they already have, fill a grid on skills they want to develop and the benefits, and discuss it with a partner.","lm":[2],"u":"2B U3","r":"Skills I want to develop and why","uid":"TL|H|2|2B|3"}]}},"full":[]},"TL|H|3":{"terms":{"1":"The arts · Me and my relationships · Leadership qualities · WA1","2":"Living in harmony with nature · The Tamil way of life · WA2 · Oral","3":"Mental well-being · Tamil and the world · AA","4":"End-of-year preparation (first 2 weeks) · End-of-year exam"},"e21":{"CCI 1":{"1":[{"t":"The arts: Producing and uploading an arts podcast with an interview","w":"Activity 1.10","y":"Students script a podcast series with title, opening, body and ending, include an interview episode and upload it to the learning platform. Mostly one way.","u":"U1","r":"Producing and uploading an arts podcast with an interview","uid":"TL|H|3||1"},{"t":"Me and my relationships: Class debate on a set topic","w":"Activity 2.12","y":"Students prepare and argue two opposed views under agreed rules, learning to think even-handedly and listen closely. Two-way, with reasons tested by the other side.","u":"U2","r":"Class debate on a set topic","uid":"TL|H|3||2"},{"t":"Leadership qualities: Writing a short speech for a stated purpose","w":"Activity 3.9","y":"Students work out how a short speech differs from talk and oratory, including who speaks and why, then write one. One way, so below the persuasive Level 4 bar.","u":"U3","r":"Writing a short speech for a stated purpose","uid":"TL|H|3||3"}],"3":[{"t":"Mental well-being: Class debate before writing","w":"Activity 6.9","y":"Two groups debate the set workbook topic with teacher guidance, then organise the points made into an essay. Two-way, with reasons tested by the other group.","u":"U6","r":"Class debate before writing","uid":"TL|H|3||6"},{"t":"Tamil and the world: Writing a moderator speech","w":"Activity 7.11","y":"Students learn what a moderator must do at an event, compare a model with their own list of features, and write a speech for that role. One way, for a set purpose.","u":"U7","r":"Writing a moderator speech","uid":"TL|H|3||7"},{"t":"Debate speech: Arguing a position with reasons and evidence","y":"Students prepare and deliver a debate speech of about 2 to 3 minutes
