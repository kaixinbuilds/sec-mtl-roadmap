edia posts.","u":"1A U2","r":"Telling teasing from mockery on social media","uid":"ML|G3|1|1A|2"},{"t":"Unit 2: Words of support for a friend who is hurting","y":"Students use words of support and hope for a friend who is hurting.","u":"1A U2","r":"Words of support for a friend who is hurting","uid":"ML|G3|1|1A|2"}],"2":[{"t":"Unit 4: Respecting different choices of music","y":"Students discuss why it matters to respect each person’s different choice of music.","u":"1A U4","r":"Respecting different choices of music","uid":"ML|G3|1|1A|4"},{"t":"Unit 5: Why polite, indirect wording matters","y":"Students discuss why indirect, polite wording protects courtesy.","u":"1B U5","r":"Why polite, indirect wording matters","uid":"ML|G3|1|1B|5"},{"t":"Unit 5: How polite and impolite posts affect relationships","y":"Students examine how polite and impolite posts affect relationships and image.","u":"1B U5","r":"How polite and impolite posts affect relationships","uid":"ML|G3|1|1B|5"}],"3":[{"t":"Unit 8: Sincerity and appreciation in giving and receiving","y":"Students discuss sincerity, appreciation and taking advantage in giving and receiving.","u":"1B U8","r":"Sincerity and appreciation in giving and receiving","uid":"ML|G3|1|1B|8"}]},"CCI 3":{"2":[{"t":"Unit 4: Reworking and performing a song as a group","y":"Groups rework the song ‘Orang Singapura’ and agree how to perform it. Students also take peer feedback on their story drafts.","u":"1A U4","r":"Reworking and performing a song as a group","uid":"ML|G3|1|1A|4"}]},"CGC 1":{"1":[{"t":"Unit 2: Social media problems in the news","y":"Students research news on common social media problems and discuss ways to address them.","u":"1A U2","r":"Social media problems in the news","uid":"ML|G3|1|1A|2"}],"2":[{"t":"Unit 4: Current issues on songs and youth","y":"Students discuss current issues on songs and youth, and traditional songs and students.","u":"1A U4","r":"Current issues on songs and youth","uid":"ML|G3|1|1A|4"}],"3":[{"t":"Unit 6: Debating whether innovation keeps Malay food relevant","y":"Students gather public comments, then debate whether innovation keeps Malay food relevant.","u":"1B U6","r":"Debating whether innovation keeps Malay food relevant","uid":"ML|G3|1|1B|6"},{"t":"Unit 8: Forms of contribution in Singapore society","y":"Students identify forms of contribution in Singapore society and discuss community work through social media.","u":"1B U8","r":"Forms of contribution in Singapore society","uid":"ML|G3|1|1B|8"},{"t":"Unit 8: Comparing forms of contribution","y":"Students compare the many forms contribution can take.","u":"1B U8","r":"Comparing forms of contribution","uid":"ML|G3|1|1B|8"}]}},"ibl":{"Investigation":{"1":[{"t":"Unit 1: Browsing news sites to find out more about sweatshop factories","w":"Ehwal Semasa","y":"Students search news sites on SLS for more on factory working conditions, then share what they found using the topic-points-words note guide.","u":"1A U1","r":"Browsing news sites to find out more about sweatshop factories","uid":"ML|G3|1|1A|1"},{"t":"Unit 1: Exploring traditional and modern patterns online before designing a shoe","w":"Bahagian 2","y":"Students look up patterns online, draw one traditional and one modern pattern from their search, then combine them into their own design.","u":"1A U1","r":"Exploring traditional and modern patterns online before designing a shoe","uid":"ML|G3|1|1A|1"},{"t":"Unit 3: Searching the web for facts about the traditional Malay kite (wau)","w":"Bahagian 1","y":"Students use a given information-search guide to find out about wau shapes and patterns online, then fill in what they found.","u":"1A U3","r":"Searching the web for facts about the traditional Malay kite (wau)","uid":"ML|G3|1|1A|3"}],"3":[{"t":"Unit 6: Researching why pulut kuning and other foods are symbolic, across cultures","w":"Bahagian 2","y":"In pairs or groups students search online for why rice dishes are symbolic, find sticky-rice foods from other communities, then share findings with the class.","u":"1B U6","r":"Researching why pulut kuning and other foods are symbolic, across cultures","uid":"ML|G3|1|1B|6"},{"t":"Unit 6: Pairs find other nasi lemak innovations and present what they found","w":"Bahagian 1","y":"Pairs search for further nasi lemak innovations using the information-search guide and present their findings, optionally with slides.","u":"1B U6","r":"Pairs find other nasi lemak innovations and present what they found","uid":"ML|G3|1|1B|6"},{"t":"Unit 7: Groups work through a dilemma card with a decision guide (team inquiry)","w":"Bahagian 2","y":"The guide names this team-inquiry activity: groups analyse a dilemma card, weigh the effects of each choice using a decision guide, then propose a solution. It is reasoning, not outside research.","g":true,"u":"1B U7","r":"Groups work through a dilemma card with a decision guide (team inquiry)","uid":"ML|G3|1|1B|7"},{"t":"Unit 8: Using a research guide to find news of people helping others","w":"Bahagian 2","y":"Students use the research guide to find news about efforts by individuals or groups to help others, as input to their group task.","u":"1B U8","r":"Using a research guide to find news of people helping others","uid":"ML|G3|1|1B|8"}]},"Conclusion":{"1":[{"t":"Unit 1: Sharing group findings in a gallery-style rotation, then reflecting in writing","w":"Bahagian 3","y":"Groups swap stations to present what happened during their group investigation, then students write a personal reflection and note what and how they learned.","u":"1A U1","r":"Sharing group findings in a gallery-style rotation, then reflecting in writing","uid":"ML|G3|1|1A|1"}],"3":[{"t":"Unit 7: Posting group solutions on Padlet and responding to other groups","w":"Bahagian 2","y":"After the dilemma task, groups type their response on a shared Padlet, respond to other groups' work, then share with the class.","g":true,"u":"1B U7","r":"Posting group solutions on Padlet and responding to other groups","uid":"ML|G3|1|1B|7"},{"t":"Unit 8: Groups present a community concern, its causes, efforts so far and their hopes","w":"Bahagian 2","y":"Groups choose a concern at home or school, set out the target group, causes and existing efforts, and present it to the class.","u":"1B U8","r":"Groups present a community concern, its causes, efforts so far and their hopes","uid":"ML|G3|1|1B|8"}]},"Conceptualisation":{"3":[{"t":"Unit 6: KWL chart on fusion food before the reading","w":"Bahagian 1","y":"Students use a know, want-to-know, learned chart to record what they already know and what they want to find out about fusion food.","u":"1B U6","r":"KWL chart on fusion food before the reading","uid":"ML|G3|1|1B|6"}]}},"pos":{"Accomplishment":{"3":[{"t":"WA3 authentic task: drafting a presentation script, getting feedback, then rehearsing","y":"Students draft a mind map and script, get peer or teacher comments on the script, rehearse, then present against a rubric. Improvement from feedback, not only a one-off task.","aa":true,"lm":[2],"u":"WA3 authentic task","r":"drafting a presentation script, getting feedback, then rehearsing"}],"1":[{"t":"Unit 3: Planning how to overcome a challenge in their own CCA","w":"Bahagian 3","y":"Using a four-step guide, students set a target, plan to be proactive, build skills and seek help to tackle a challenge from their own CCA.","lm":[2,3],"u":"1A U3","r":"Planning how to overcome a challenge in their own CCA","uid":"ML|G3|1|1A|3"},{"t":"Unit 3: Writing a journal on their CCA challenges and progress","w":"Bahagian 3","y":"Students write a journal about their CCA experience, covering challenges faced and how they tried to overcome them.","lm":[2],"u":"1A U3","r":"Writing a journal on their CCA challenges and progress","uid":"ML|G3|1|1A|3"}],"2":[{"t":"Unit 4: Sharing a story draft and gathering classmates' feedback before writing it out","w":"Bahagian 3","y":"Students discuss their retelling draft with partners, share it with the class, receive feedback from peers, then write the full story.","lm":[2],"u":"1A U4","r":"Sharing a story draft and gathering classmates' feedback before writing it out","uid":"ML|G3|1|1A|4"}]},"Relationships":{"1":[{"t":"Unit 2: Writing a motivational message to a friend hurt by a post","w":"Bahagian 2","y":"Students write an encouraging message with a proverb to a friend upset by an insensitive post, then a peer checks it against a message checklist.","u":"1A U2","r":"Writing a motivational message to a friend hurt by a post","uid":"ML|G3|1|1A|2"}],"2":[{"t":"Unit 5: Acting out polite, considerate conversations in everyday scenarios","w":"Bahagian 3","y":"Students role-play scenarios of speaking politely with relatives, elders and friends to draw a good response from others.","u":"1B U5","r":"Acting out polite, considerate conversations in everyday scenarios","uid":"ML|G3|1|1B|5"}]},"Emotions":{"1":[{"t":"Unit 2: Weighing angry, calm and talk-it-out responses to a hurtful post","w":"Bahagian 3","y":"Students name feelings with feeling words, then weigh how an angry, a calm or a talk-it-through reaction would affect the people involved, and say what they would do.","u":"1A U2","r":"Weighing angry, calm and talk-it-out responses to a hurtful post","uid":"ML|G3|1|1A|2"}],"2":[{"t":"Unit 4: Building playlists for happy, sad and angry moods","w":"Bahagian 1","y":"Groups choose songs for different emotions and explain why a song suits each feeling, linking music to how they express emotions.","u":"1A U4","r":"Building playlists for happy, sad and angry moods","uid":"ML|G3|1|1A|4"}],"3":[{"t":"Unit 7: Private pause-and-reflect on feeling pressured like the characters","w":"Bahagian 1","y":"Students reflect quietly for about three minutes on whether they have felt similar pressure and how it felt, without having to share.","u":"1B U7","r":"Private pause-and-reflect on feeling pressured like the characters","uid":"ML|G3|1|1B|7"}]},"Health":{"3":[{"t":"Unit 7: Sharing how they personally cope with stress","w":"Pembuka Bicara","y":"In the opening discussion students say how they handle pressure and why people cope differently. A one-off discussion, with the guide asking only that ways of coping do not harm oneself.","u":"1B U7","r":"Sharing how they personally cope with stress","uid":"ML|G3|1|1B|7"}]},"Engagement":{"1":[{"t":"Unit 1: Designing their own shoe pattern from traditional and modern motifs","w":"Bahagian 2","y":"Students make a design they own by merging traditional and modern patterns on a shoe drawing, then explain their colour and pattern choices to a peer.","lm":[4],"u":"1A U1","r":"Designing their own shoe pattern from traditional and modern motifs","uid":"ML|G3|1|1A|1"}],"2":[{"t":"Unit 4: Reworking the song 'Orang Singapura' in a style of their choice","w":"Bahagian 3","y":"Groups plan how to remake the song to suit teen tastes, for example with beatbox or a new rhythm, and perform or record it.","u":"1A U4","r":"Reworking the song 'Orang Singapura' in a style of their choice","uid":"ML|G3|1|1A|4"}],"3":[{"t":"Unit 6: Writing a recipe that updates a traditional dish they choose","w":"Bahagian 3","y":"Students pick a traditional dish they want to adapt, then write what to change and what to keep, and why.","u":"1B U6","r":"Writing a recipe that updates a traditional dish they choose","uid":"ML|G3|1|1B|6"}]},"Purpose":{"3":[{"t":"Unit 8: Choosing a community concern the group could help with","w":"Bahagian 2","y":"Groups think of one concern at home or school that they could help with, who it affects and how, and present it.","u":"1B U8","r":"Choosing a community concern the group could help with","uid":"ML|G3|1|1B|8"}]}},"full":[]},"ML|G3|2":{"terms":{"1":"Unit 1: Free but precious · Unit 2: Self-care · Unit 3: Waves of change · WA1","2":"Unit 4: Spread your wings · Unit 5: Me, us, them? · Unit 6: When love blooms · AA · Oral","3":"Unit 7: Gain knowledge, celebrate yourself · Unit 8: Dare to dream · WA3","4":"End-of-yea e a poem about a challenge they faced, then check it with a self-assessment checklist and rate their own learning.","u":"1B U8","r":"Writing a poem about turning a challenge into strength","uid":"ML|H|1|1B|8"}],"1":[{"t":"Unit 3: Thinking about their own growth in CCA and writing a diary entry","w":"Bahagian 3","y":"Students consider how their CCA helps them build new skills, record it in the activity book and write a diary entry about their feelings in the CCA.","u":"1A U3","r":"Thinking about their own growth in CCA and writing a diary entry","uid":"ML|H|1|1A|3"}],"2":[{"t":"Unit 5: Checking an infographic against a checklist and refining it","w":"Bahagian 2","y":"Students check their infographic against the stated criteria and polish it where verb-linking words are misused.","u":"1B U5","r":"Checking an infographic against a checklist and refining it","uid":"ML|H|1|1B|5"},{"t":"Unit 6: Reflecting on the hardest part of the role-play and how they coped","w":"Bahagian 1","y":"After performing, students say which part was hardest, how they handled it, and what could be improved, using peer comments.","u":"1B U6","r":"Reflecting on the hardest part of the role-play and how they coped","uid":"ML|H|1|1B|6"}]},"Engagement":{"1":[{"t":"Unit 1: Choosing their own research topic on Malay language, culture or literature","w":"Bahagian 2","y":"Students pick the topic they want to research about Malay language, culture and literature and form their own questions, giving real choice over what they learn.","u":"1A U1","r":"Choosing their own research topic on Malay language, culture or literature","uid":"ML|H|1|1A|1"}],"2":[{"t":"Unit 4: Sharing song lyrics they love and explaining why","w":"Bahagian 2","y":"Students bring lyrics of songs they like and explain why those songs matter to them, so the learning draws on their own interests.","u":"1A U4","r":"Sharing song lyrics they love and explaining why","uid":"ML|H|1|1A|4"}]},"Emotions":{"1":[{"t":"Unit 2: Naming feelings with into a visual for the character's problem.","u":"2A U2","r":"Finding reliable information on symptoms and wellbeing problems online","uid":"ML|H|2|2A|2"},{"t":"Unit 2: Searching for suitable self-care steps and other cultures' practices","w":"Bahagian 2","y":"Students search the internet or library for wellbeing steps that suit the character and for wellbeing practices in other cultures, then recommend steps.","u":"2A U2","r":"Searching for suitable self-care steps and other cultures' practices","uid":"ML|H|2|2A|2"},{"t":"Unit 3: Researching a chosen person for a biography","w":"Bahagian 3","y":"Students research a person they chose, using a step-by-step scouting task and a video on screening online information, and note the facts they gather.","u":"2A U3","r":"Researching a chosen person for a biography","uid":"ML|H|2|2A|3"}],"2":[{"t":"Unit 4: Researching a group from the Malay world who migrated to Singapore","w":"Bahagian 2","y":"Students use a scouting task to find information on one community that migrated to Singapore long ago and record what they find.","u":"2A U4","r":"Researching a group from the Malay world who migrated to Singapore","uid":"ML|H|2|2A|4"},{"t":"Unit 5: Mini research on trending social media terms and Malay equivalents","w":"Bahagian 1","y":"Groups research current social media terms, check whether Malay equivalents exist and, if not, invent a Malay word for the English term.","u":"2B U5","r":"Mini research on trending social media terms and Malay equivalents","uid":"ML|H|2|2B|5"},{"t":"Unit 5: Finding out about fashion styles and the symbols behind them","w":"Pembuka Bicara","y":"Students search online for fashion styles they have not seen and for the symbols behind fashions, then share what they found.","u":"2B U5","r":"Finding out about fashion styles and the symbols behind them","uid":"ML|H|2|2B|5"},{"t":"Unit 6: Finding a true story of how love helps the world","w":"Bahagian 2","y":"Students look online for a real story of love contributing to the world's wellbeing, record the link and summarise it in the activity book.","u":"2B U6","r":"Finding a true story of how love helps the world","uid":"ML|H|2|2B|6"}],"3":[{"t":"Unit 7: Researching another job expected in 2030","w":"Bahagian 1","y":"In pairs students research online one other job expected in future, its tasks and the knowledge and skills it needs, and record what they find.","u":"2B U7","r":"Researching another job expected in 2030","uid":"ML|H|2|2B|7"},{"t":"Unit 8: Finding true stories of people who dared to dream","w":"Bahagian 1","y":"Students search news sites for true stories of people who pursued their dreams and may use these stories as evidence in their debate.","u":"2B U8","r":"Finding true stories of people who dared to dream","uid":"ML|H|2|2B|8"}]},"Conclusion":{"1":[{"t":"Unit 1: Sharing survey findings and being asked for evidence","w":"Bahagian 1","y":"Each group reports its survey findings to the class and answers questions asking for evidence and for reasons why adults and teens answered differently.","u":"2A U1","r":"Sharing survey findings and being asked for evidence","uid":"ML|H|2|2A|1"},{"t":"Unit 2: Presenting visuals and answering classmates' questions","w":"Bahagian 1","y":"Groups share their visual on the character's problem and receive feedback and questions from classmates on their work.","u":"2A U2","r":"Presenting visuals and answering classmates' questions","uid":"ML|H|2|2A|2"},{"t":"Unit 3: Hot-seat questioning to test if their research is enough","w":"Bahagian 3","y":"A student acts as their chosen person and classmates question them; gaps in the answers show the research is not yet complete.","u":"2A U3","r":"Hot-seat questioning to test if their research is enough","uid":"ML|H|2|2A|3"}]}},"pos":{"Engagement":{"1":[{"t":"Unit 1: Making their own photoblog about free-time experiences","w":"Bahagian 2","y":"Students create a photoblog of their own leisure experiences, using figurative language, after studying what makes a good one.","u":"2A U1","r":"Making their own photoblog about free-time experiences","uid":"ML|H|2|2A|1"},{"t":"Unit 3: Choosing a person they want to write a biography about","w":"Bahagian 3","y":"Students think about whom they would like to write a biography of and why, then write about that person of their own choosing.","u":"2A U3","r":"Choosing a person they want to write a biography about","uid":"ML|H|2|2A|3"}],"2":[{"t":"Unit 4: Choosing what is special about Singapore for their travelogue","w":"Bahagian 3","y":"Students pick what is interesting and unique about Singapore to feature, from their own perspective, in their own travel video.","u":"2A U4","r":"Choosing what is special about Singapore for their travelogue","uid":"ML|H|2|2A|4"},{"t":"Unit 5: Inventing a Malay word for a trending term","w":"Bahagian 1","y":"Students invent a Malay word for an English social media term that has no translation, and add words to a vocabulary bank made creatively.","u":"2B U5","r":"Inventing a Malay word for a trending term","uid":"ML|H|2|2B|5"}],"3":[{"t":"Unit 8: Making a vision board of their own aspirations","w":"Bahagian 1","y":"Students build a physical or online vision board of their own aspirations, present it, and receive classmates' comments and questions.","u":"2B U8","r":"Making a vision board of their own aspirations","uid":"ML|H|2|2B|8"}]},"Health":{"1":[{"t":"Unit 1: Choosing the way of organising free time that suits them","w":"Bahagian 2","y":"Students read about ways to organise time, link them to their own experience, and choose the way that suits themselves, thinking about rest and meaningful use of time.","u":"2A U1","r":"Choosing the way of organising free time that suits them","uid":"ML|H|2|2A|1"},{"t":"Unit 2: Designing a class wellbeing routine and reflecting on their own problems","w":"Bahagian 3","y":"Students make a poster of a wellbeing routine for physical, mental, emotional and spiritual health that they will follow, and reflect on their own troubles and actions to take.","u":"2A U2","r":"Designing a class wellbeing routine and reflecting on their own problems","uid":"ML|H|2|2A|2"}]},"Accomplishment":{"1":[{"t":"Unit 3: Checking a first biography draft and improving it","w":"Bahagian 3","y":"Students write a first draft, then review it themselves or with a classmate for suitable content and suggestions before the final version.","u":"2A U3","r":"Checking a first biography draft and improving it","uid":"ML|H|2|2A|3"}],"2":[{"t":"Unit 4: Improving the travelogue after teacher and class feedback","w":"Bahagian 3","y":"Students receive feedback from the teacher and the class on their travelogue script, then improve its content.","u":"2A U4","r":"Improving the travelogue after teacher and class feedback","uid":"ML|H|2|2A|4"}],"3":[{"t":"Unit 7: Reflecting on current skills and those needed for a future job","w":"Bahagian 1","y":"Students write down what knowledge and skills they have now and what they would need for a future job, linking their goals to what to build.","u":"2B U7","r":"Reflecting on current skills and those needed for a future job","uid":"ML|H|2|2B|7"},{"t":"Unit 8: Ranking three personal aspirations and mapping steps on a timeline","w":"Bahagian 1","y":"Students list three goals ranked by difficulty, explain their choices, then sketch a timeline of steps and factors to reach their aspirations.","u":"2B U8","r":"Ranking three personal aspirations and mapping steps on a timeline","uid":"ML|H|2|2B|8"}]},"Emotions":{"2":[{"t":"Unit 6: Imagining a world full of love and one without it","w":"Bahagian 2","y":"Students share their hopes for a world full of love in pairs and groups, then list words describing a world without love, to appreciate what love gives.","u":"2B U6","r":"Imagining a world full of love and one without it","uid":"ML|H|2|2B|6"}],"3":[{"t":"Unit 8: Imagining a success headline for their aspiration","w":"Bahagian 3","y":"Students imagine the news headline that would tell the story if they reached their aspiration and share this reflection with the class, building hope.","u":"2B U8","r":"Imagining a success headline for their aspiration","uid":"ML|H|2|2B|8"}]}},"full":["Unit 1: Don't waste the time you have","Unit 2: Still waters"]},"ML|H|3":{"terms":{"1":"Unit 1: Share alike, big or small · Unit 2: Different bowls, different cups · WA1","2":"Unit 3: Don't be indifferent · Unit 4: Prop up the leaning, help the weak · WA2 · Oral","3":"Unit 5: Truth will surface · Unit 6: Strong because of its knot · AA","4":"End-of-year preparation (first 2 weeks) · End-of-year exam"},"e21":{"CAIT 3":{"1":[{"t":"Unit 2: Comparing how self-expression differs across generations","y":"Students interview someone of another generation and use a Venn diagram to compare with themselves. Partial: new insight is not asked for.","u":"U2","r":"Comparing how self-expression differs across generations","uid":"ML|H|3||2"}],"3":[{"t":"Unit 6: Viewing one question as a tourist, a worker and a student","w":"Bahagian 2","y":"Students answer the same question from the standpoint of a tourist, a worker and a student, then compare early and later answers after learning about cultural intelligence.","u":"U6","r":"Viewing one question as a tourist, a worker and a student","uid":"ML|H|3||6"}]},"CCI 1":{"3":[{"t":"WA3 authentic task: team debate on a given motion, with prepared scripts","y":"Teams argue a stated side of a motion in set speaking roles, with key terms defined, main ideas for both sides listed, and rebuttal or interjection in response to opponents. Scored on team strategy too.","aa":true,"u":"WA3 authentic task","r":"team debate on a given motion, with prepared scripts"}],"2":[{"t":"WA2: Functional email or forum reply, choice of two","y":"Students choose one of two situations and write an email or forum reply to a stated reader for a clear purpose, covering the points required. One way only: a single written message.","u":"WA2","r":"Functional email or forum reply, choice of two"},{"t":"Oral: planned view on a statement, then justifying it to the examiner","y":"Students give a planned two-minute view on a statement, then justify and defend it as the examiner asks for explanation, examples and reasons.","u":"Oral","r":"planned view on a statement, then justifying it to the examiner"},{"t":"Unit 4: Pitching the action plan to a role-playing panel","w":"Bahagian 3","y":"Groups pitch their plan in 120 seconds to an audience acting as judges and customers, then each student records an individual speech to convince the judges.","u":"U4","r":"Pitching the action plan to a role-playing panel","uid":"ML|H|3||4"}],"4":[{"t":"EOY Paper 1 Section A: Functional email or forum reply, choice of two","y":"Students choose one of two situations and write an email or forum reply to a stated reader for a clear purpose, covering the points required. One way only: a single written message.","u":"EOY Paper 1 Section A","r":"Functional email or forum reply, choice of two"}],"1":[{"t":"Unit 1: Performing a song, poem or sketch about a human rights concern","w":"Bahagian 3","y":"Pairs or groups create and perform a short song, poem or sketch voicing concern about a human rights issue, deciding what to say; the audience response is not set out.","u":"U1","r":"Performing a song, poem or sketch about a human rights concern","uid":"ML|H|3||1"}]},"CCI 2":{"1":[{"t":"Unit 2: Reading differing views on social media and responding respectfully to peers","w":"Bahagian 2","y":"Students read four short views on social media's effect, give their own view with reasons, and reply to a peer's post, with courtesy in language and respect for other perspectives stressed.","u":"U2","r":"Reading differing views on social media and responding respectfully to peers","uid":"ML|H|3||2"}],"2":[{"t":"Unit 3: Taking the viewpoints of those around an abuse case","w":"Bahagian 2","y":"Students speak from the viewpoint of a doctor, an agency owner and a neighbour in a case of abuse of a domestic worker, and are asked to listen without judging classmates' own experiences.","u":"U3","r":"Taking the viewpoints of those around an abuse case","uid":"ML|H|3||3"}],"3":[{"t":"Unit 6: Learning cultural intelligence to relate to neighbouring countries","w":"Bahagian 2","y":"Students learn cultural intelligence, reflect on experiences of ethnocentrism and comment on classmates' reactions to news, so they practise respectful communication across cultures.","u":"U6","r":"Learning cultural intelligence to relate to neighbouring countries","uid":"ML|H|3||6"}]},"CGC 1":{"2":[{"t":"Unit 3: Judging how much each person in a Singapore abuse case showed care","w":"Bahagian 2","y":"Students study a case set in Singapore and give viewpoints of several people involved, judging how much each showed care for the domestic worker. Link to national issues is thin.","u":"U3","r":"Judging how much each person in a Singapore abuse case showed care","uid":"ML|H|3||3"}],"3":[{"t":"Unit 6: Explaining what Singapore does to stay sustainable","w":"Bahagian 1","y":"Students ask whether Singapore can stand alone and present, in infographics, efforts for national sustainability, then answer questions about each group's infographic.","u":"U6","r":"Explaining what Singapore does to stay sustainable","uid":"ML|H|3||6"}]},"CGC 2":{"2":[{"t":"Unit 4: Planning a social enterprise to help a community group","w":"Bahagian 2","y":"In groups of four students plan a social enterprise for a youth programme and fund, filling an action plan template and checklist. It is a class simulation, not a real programme.","u":"U4","r":"Planning a social enterprise to help a community group","uid":"ML|H|3||4"}]},"CCI 3":{"2":[{"t":"Unit 4: Building the action plan together on a shared mind map","w":"Bahagian 2","y":"Four-person groups discuss what their enterprise should be and build the plan together on a shared online mind map and template, checking it against a list of criteria.","u":"U4","r":"Building the action plan together on a shared mind map","uid":"ML|H|3||4"}],"3":[{"t":"Unit 5: Reaching one agreed conclusion about the case","w":"Bahagian 1","y":"Groups must present a conclusion based on agreement within the group, so members weigh differing readings of the evidence and settle on one.","u":"U5","r":"Reaching one agreed conclusion about the case","uid":"ML|H|3||5"}]},"CAIT 4":{"3":[{"t":"Unit 5: Changing conclusions when new evidence arrives","w":"Bahagian 2","y":"As new videos and forensic findings arrive, students reopen the case and revise their earlier conclusion. The guide frames this as continued investigation, so fit is partial.","u":"U5","r":"Changing conclusions when new evidence arrives","uid":"ML|H|3||5"},{"t":"Unit 6: Applying cultural intelligence to change real-life situations","w":"Bahagian 3","y":"Students apply levels of cultural intelligence to sample scenarios, then say how each could change so a person acts as a more caring world citizen.","u":"U6","r":"Applying cultural intelligence to change real-life situations","uid":"ML|H|3||6"}]}},"ibl":{"Orientation":{"1":[{"t":"Unit 1: Is the customer always right? Taking a view without naming a side","w":"Bahagian 2","y":"Students swap views on a provocative statement about customers' rights without declaring a position, before watching a video on rights and duties.","g":true,"u":"U1","r":"Is the customer always right? Taking a view without naming a side","uid":"ML|H|3||1"},{"t":"Unit 2: Guessing the voice behind street art, fashion and dance","w":"Pembuka Bicara","y":"Students look at street art, song, fashion and dance and guess what voice or message each expresses, then comment on classmates' guesses.","u":"U2","r":"Guessing the voice behind street art, fashion and dance","uid":"ML|H|3||2"}],"2":[{"t":"Unit 4: Giving first views on social enterprise from a short video","w":"Pembuka Bicara","y":"Students watch a video on tackling social problems through business, record their first views, then revise them later using a thinking routine.","g":true,"u":"U4","r":"Giving first views on social enterprise from a short video","uid":"ML|H|3||4"}],"3":[{"t":"Unit 5: A puzzling case of workers suddenly falling ill","w":"Bahagian 1","y":"Students take the role of investigators handed a newspaper report of workers falling ill suddenly, and are asked what they would do and what they want to ask.","g":true,"u":"U5","r":"A puzzling case of workers suddenly falling ill","uid":"ML|H|3||5"},{"t":"Unit 6: Alone on an island: can a person, or Singapore, live alone?","w":"Bahagian 1","y":"Students imagine living alone on a remote island, say how long they would last, then ask whether Singapore could live on its own.","u":"U6","r":"Alone on an island: can a person, or Singapore, live alone?","uid":"ML|H|3||6"}]},"Conceptualisation":{"1":[{"t":"Unit 1: Asking as many questions as possible about world hunger and human rights","w":"Bahagian 1","y":"Using problem-facing steps, students write many of their own questions about why people still go hungry despite the human rights charter, and explain why each matters.","u":"U1","r":"Asking as many questions as possible about world hunger and human rights","uid":"ML|H|3||1"}],"3":[{"t":"Unit 5: Writing their own new questions before watching the evidence video","w":"Bahagian 1","y":"When new information appears, students think up the new questions they want answered before they watch the video.","g":true,"u":"U5","r":"Writing their own new questions before watching the evidence video","uid":"ML|H|3||5"},{"t":"Unit 6: Giving first answers on cultural awareness before learning more","w":"Bahagian 2","y":"Students answer a question as a tourist, a worker and a student before taught about cultural intelligence, and these early answers are kept for later comparison.","g":true,"u":"U6","r":"Giving first answers on cultural awareness before learning more","uid":"ML|H|3||6"}]},"Investigation":{"1":[{"t":"Unit 1: Finding more information on a rights campaigner's life and cause","w":"Bahagian 3","y":"Students search for extra information on a historical campaigner and answer questions about her time and cause from the text and their own research.","u":"U1","r":"Finding more information on a rights campaigner's life and cause","uid":"ML|H|3||1"},{"t":"Unit 2: Interviewing someone from another generation and comparing with a Venn diagram","w":"Bahagian 1","y":"Students are left free to run a self-directed interview and use a Venn diagram to compare themselves with the person they interviewed.","u":"U2","r":"Interviewing someone from another generation and comparing with a Venn diagram","uid":"ML|H|3||2"},{"t":"Unit 2: Searching news sites for self-expression seen as excessive","w":"Bahagian 3","y":"Students search news sites for articles or videos showing self-expression seen as excessive and reflect on why it is seen that way.","u":"U2","r":"Searching news sites for self-expression seen as excessive","uid":"ML|H|3||2"}],"2":[{"t":"Unit 3: Searching news sites for other Singapore figures and what they gave","w":"Bahagian 1","y":"Students search news sites for other Singapore figures and their contributions, post what they find, and discuss articles with peers.","u":"U3","r":"Searching news sites for other Singapore figures and what they gave","uid":"ML|H|3||3"},{"t":"Unit 4: Researching social entrepreneurs and enterprises and posting findings","w":"Bahagian 1","y":"Students search for information on social entrepreneurs and enterprises in Singapore or abroad, share on a class board and question each other's posts.","u":"U4","r":"Researching social entrepreneurs and enterprises and posting findings","uid":"ML|H|3||4"}],"3":[{"t":"Unit 5: Watching video evidence and inferring who fell ill and why","w":"Bahagian 1","y":"In groups students watch two videos, note who fell ill and what each person touched or wore, use an inference guide, and revise conclusions with new evidence.","g":true,"u":"U5","r":"Watching video evidence and inferring who fell ill and why","uid":"ML|H|3||5"},{"t":"Unit 5: Sorting documents into facts and assumptions","w":"Bahagian 2","y":"Students go through case documents with a partner, separating facts from assumptions, then write their own questions about a news report.","u":"U5","r":"Sorting documents into facts and assumptions","uid":"ML|H|3||5"},{"t":"Unit 6: Researching Singapore's national sustainability efforts and making an infographic","w":"Bahagian 1","y":"Groups pick one aspect of national sustainability, find out what is being done in Singapore, and make an infographic.","u":"U6","r":"Researching Singapore's national sustainability efforts and making an infographic","uid":"ML|H|3||6"}]},"Conclusion":{"1":[{"t":"Unit 1: Revisiting their view after the video and commenting on classmates' views","w":"Bahagian 2","y":"After the video students answer again how they now see the statement, and respond to classmates' posts, so they reflect on whether their view changed.","g":true,"u":"U1","r":"Revisiting their view after the video and commenting on classmates' views","uid":"ML|H|3||1"}],"2":[{"t":"Unit 4: Presenting an action plan and answering role-played audience questions","w":"Bahagian 3","y":"Groups present their plan in 120 seconds, and classmates in the roles of judge, business person, social entrepreneur and customer ask questions the presenters must answer.","u":"U4","r":"Presenting an action plan and answering role-played audience questions","uid":"ML|H|3||4"}],"3":[{"t":"Unit 5: Groups present agreed conclusions and question each other","w":"Bahagian 1","y":"Each group presents a conclusion the group agreed on, then questions the other groups on theirs.","g":true,"u":"U5","r":"Groups present agreed conclusions and question each other","uid":"ML|H|3||5"},{"t":"Unit 6: Comparing early and later answers on cultural intelligence","w":"Bahagian 2","y":"After the video and research, students compare their first answers with their later ones and post responses to peers in the online board.","g":true,"u":"U6","r":"Comparing early and later answers on cultural intelligence","uid":"ML|H|3||6"}]}},"pos":{"Purpose":{"1":[{"t":"Unit 1: Reflecting on the part teenagers can play in human rights","w":"Bahagian 3","y":"Students voice a rights concern through a creative piece, then write and discuss what role teenagers like them can play and why their voices matter.","u":"U1","r":"Reflecting on the part teenagers can play in human rights","uid":"ML|H|3||1"}],"2":[{"t":"Unit 3: Thinking how their own care can improve life for others","w":"Bahagian 3","y":"Students are told they too can play a part in improving community life through care, discuss questions on this in pairs, and write a story of someone who acts to bring change.","u":"U3","r":"Thinking how their own care can improve life for others","uid":"ML|H|3||3"},{"t":"Unit 4: Designing a social enterprise to meet a community need","w":"Bahagian 2","y":"Students plan, as a group, a social enterprise aimed at helping a chosen group in need and explain why that group was chosen.","u":"U4","r":"Designing a social enterprise to meet a community need","uid":"ML|H|3||4"}]},"Engagement":{"2":[{"t":"Unit 3: Making their own digital storybook about a caring person","w":"Bahagian 3","y":"Students plan and build a digital storybook of their own, choosing free software, about a person who cares and acts to change things.","u":"U3","r":"Making their own digital storybook about a caring person","uid":"ML|H|3||3"}],"3":[{"t":"Unit 5: Inventing a secret language code and cracking another group's","w":"Pembuka Bicara","y":"Groups invent their own secret language code and try to crack other groups' codes, an absorbing puzzle task of their own making.","u":"U5","r":"Inventing a secret language code and cracking another group's","uid":"ML|H|3||5"}]},"Relationships":{"2":[{"t":"Unit 4: Naming two good qualities in a partner","w":"Bahagian 1","y":"Pairs think of two positive qualities in each other and find describing words to portray their character, practising appreciation of a peer.","u":"U4","r":"Naming two good qualities in a partner","uid":"ML|H|3||4"}]}},"full":["Unit 1: Share alike, big or small","Unit 5: Truth will surface","Unit 6: Strong because of its knot"]},"ML|H|4":{"terms":{"1":"Unit 1: Adapt to where you stand · Unit 2: Leaders who uphold · Unit 3: Thrive wherever you land · NWA1 · Oral","2":"Unit 4: Skills unit: listening & speaking · Unit 5: Skills unit: reading · Unit 6: Skills unit: writing · Timed practice","3":"SEC oral · Prelim · Revision","4":"SEC written papers"},"e21":{"CCI 1":{"1":[{"t":"Oral: planned view on a statement, then justifying it to the examiner","y":"Students give a planned two-minute view on a statement, then justify and defend it as the examiner asks for explanation, examples and reasons.","u":"Oral","r":"planned view on a statement, then justifying it to the examiner"},{"t":"Unit 1: Presenting a smart city improvement and receiving 5W1H questions","w":"Bahagian 1","y":"Groups propose an improvement to housing, schools or transport, present it to other groups and take their feedback and probing questions.","u":"U1","r":"Presenting a smart city improvement and receiving 5W1H questions","uid":"ML|H|4||1"},{"t":"Unit 2: Writing a formal application email on their leadership qualities","w":"Bahagian 2","y":"Students write a formal email applying for a youth exchange, stressing their own leadership qualities and those of a leader they admire. This is one-way writing.","u":"U2","r":"Writing a formal application email on their leadership qualities","uid":"ML|H|4||2"},{"t":"Unit 3: Applying to a youth ship programme using their identity and leadership","w":"Bahagian 1","y":"Students speak and write about themselves with their Malay identity markers and write a full application email to join a youth sail programme. The email is one-way.","u":"U3","r":"Applying to a youth ship programme using thei hat to buy and cut on a fixed budget","uid":"TL|G3|2|2B|2"}],"2":[{"t":"Yesterday, today, tomorrow: Groups solve a spun situation using a spun object and chance","w":"Language game","y":"Groups spin wheels for a situation, an object and an opportunity, then solve the situation using the other two. This is a chance-driven, unfamiliar problem.","u":"2B U1","r":"Groups solve a spun situation using a spun object and chance","uid":"TL|G3|2|2B|1"}]},"CCI 2":{"1":[{"t":"Friendship: Pairs role-play telling a friend they are hurt, advising and praising","w":"Language game","y":"Pairs act out set situations: reaching agreement after a difference, telling a friend how a hurt felt, advising a friend and praising a good deed.","u":"2A U1","r":"Pairs role-play telling a friend they are hurt, advising and praising","uid":"TL|G3|2|2A|1"}]},"CCI 3":{"1":[{"t":"Protecting the environment: Groups pool and refine one speaker's views","w":"Lesson 3.5","y":"Students pick one speaker from a dialogue and sum up their views, then join others who chose the same speaker to refine the points together and share.","u":"2A U3","r":"Groups pool and refine one speaker's views","uid":"TL|G3|2|2A|3"}],"2":[{"t":"Newspaper article: Group drafting and peer editing","y":"Groups peer-edit the article together and share a single video presentation, taking in each other's suggestions to finish a common product. Evidence of disagreement handling is limited.","aa":true,"u":"Newspaper article","r":"Group drafting and peer editing"},{"t":"Yesterday, today, tomorrow: Groups decide what features their e-advertisement needs","w":"Exercise 1.9","y":"Groups analyse a given situation, plan an e-advertisement, decide which elements it needs and build a draft. The guide does not mention handling disagreement.","u":"2B U1","r":"Groups decide what features their e-advertisement needs","uid":"TL|G3|2|2B|1"}],"3":[{"t":"Financial literacy: Groups agree what to buy with 50 coins and what to cut to save","w":"Activities 1 and 2","y":"Groups jointly choose 15 items within a budget, then decide which five to drop and how much to save, then report challenges and group experience.","u":"2B U2","r":"Groups agree what to buy with 50 coins and what to cut to save","uid":"TL|G3|2|2B|2"}]},"CGC 1":{"1":[{"t":"Protecting the environment: Students look up what Singapore does to protect nature","w":"Activity 3","y":"Students find evidence of Singapore's green efforts, including at Changi Airport, then discuss it in groups and answer classmates' questions.","u":"2A U3","r":"Students look up what Singapore does to protect nature","uid":"TL|G3|2|2A|3"},{"t":"Protecting the environment: Students sum up four speakers on Singapore's environment","w":"Lesson 3.5","y":"Students read a dialogue with four speakers on protecting Singapore's environment, choose one and sum up that person's views, then compare in groups.","u":"2A U3","r":"Students sum up four speakers on Singapore's environment","uid":"TL|G3|2|2A|3"}],"3":[{"t":"Youth and society: Students discuss how young people can contribute to society","w":"Lesson 3.2","y":"After reading a news item and posting their thoughts, students discuss how today's youth can contribute to society. A single issue, with views from classmates.","u":"2B U3","r":"Students discuss how young people can contribute to society","uid":"TL|G3|2|2B|3"},{"t":"Youth and society: Students explain efforts to help Singapore's Tamil community thrive","w":"Assessment activity","y":"Students discuss what is done to help the Tamil community in Singapore flourish and why, using current news as evidence. One viewpoint, so partial.","u":"2B U3","r":"Students explain efforts to help Singapore's Tamil community thrive","uid":"TL|G3|2|2B|3"}]},"CCI 1":{"1":[{"t":"Email reply: Replying to a friend's email for set purposes","y":"Students read a friend's email and write a reply covering each purpose set, such as sharing experience or giving advice, in a friendly register. One-way writing to a named reader.","u":"Email reply","r":"Replying to a friend's email for set purposes"},{"t":"Friendship: Groups present their ideas on friendship as a poster, skit or dialogue","w":"Lessons 1.1 to 1.2","y":"Groups discuss a chosen question on friendship and present it in a form of their choice. Classmates respond and ask questions, so the audience is the class.","u":"2A U1","r":"Groups present their ideas on friendship as a poster, skit or dialogue","uid":"TL|G3|2|2A|1"},{"t":"Friendship: Groups design a vlog script for a given situation and share it","w":"Lesson 1.10","y":"Groups design a dialogue, story or interview for a vlog suited to a given context, share it with the class and improve it after comments.","u":"2A U1","r":"Groups design a vlog script for a given situation and share it","uid":"TL|G3|2|2A|1"},{"t":"Hobbies: Students write a news report on benefits of hobbies for readers","w":"Lesson 2.10","y":"Students turn information gathered into a news report with the features of the form, then may post it for peers to read and comment. Largely one-way writing.","u":"2A U2","r":"Students write a news report on benefits of hobbies for readers","uid":"TL|G3|2|2A|2"},{"t":"Protecting the environment: Students write an official email for a given situation","w":"Exercise 3.7","y":"Students learn the features of an official email and write one for a stated situation. This is one-way writing for a stated purpose and recipient.","u":"2A U3","r":"Students write an official email for a given situation","uid":"TL|G3|2|2A|3"}],"2":[{"t":"Oral exam: Answering examiner questions on a video","y":"After a short video, students answer examiner questions: their reaction or experience, what they suggest, and whether they agree with a given view, giving reasons. Spoken, with the examiner.","u":"Oral exam","r":"Answering examiner questions on a video"},{"t":"Newspaper article and video: Telling a school community member's story","y":"Students interview a real person, then convey the story in a newspaper article and a recorded presentation for readers and viewers. Largely one-way presentation to an audience.","aa":true,"u":"Newspaper article and video","r":"Telling a school community member's story"},{"t":"Kings of Tamil Nadu: Pairs write a circular and present it to the class","w":"Exercise 4.6","y":"Pairs prepare a circular for a given situation and present it. Classmates comment and ask questions, then the pair improves the circular.","u":"2A U4","r":"Pairs write a circular and present it to the class","uid":"TL|G3|2|2A|4"},{"t":"Yesterday, today, tomorrow: Students rank inventions and revise after peers' views","w":"Pyramid discussion","y":"Students rank inventions by importance with evidence, read classmates' posts, comment, then revisit and change their own view where needed.","u":"2B U1","r":"Students rank inventions and revise after peers' views","uid":"TL|G3|2|2B|1"}],"4":[{"t":"Email: Replying to a friend or writing in a given role to a stated reader","y":"Students choose one email task: reply to a friend, or write in an imagined role to a stated reader. One-way writing for a set purpose and reader.","u":"Email","r":"Replying to a friend or writing in a given role to a stated reader"}],"3":[{"t":"Financial literacy: Students write a funding-request email, designed first in groups","w":"Exercise 2.7","y":"Groups design a funding-request email for a stated situation, then each student writes one and shares it. Purpose and recipient are set by the task.","u":"2B U2","r":"Students write a funding-request email, designed first in groups","uid":"TL|G3|2|2B|2"},{"t":"Youth and society: Students write a report on a school event","w":"Exercise 3.7","y":"Students learn the purpose and steps of a report and write one on a school event from a given situation. One-way writing.","u":"2B U3","r":"Students write a report on a school event","uid":"TL|G3|2|2B|3"}]},"CGC 2":{"2":[{"t":"Kings of Tamil Nadu: Groups compare roles in a royal court with those in Parliament","w":"Activity 2","y":"Groups compare who sat in a king's court and who sits in Parliament today, and compare their responsibilities. A comparison of civic roles only, nothing organised.","u":"2A U4","r":"Groups compare roles in a royal court with those in Parliament","uid":"TL|G3|2|2A|4"}]}},"ibl":{"Investigation":{"1":[{"t":"Hobbies: Students interview parents or grandparents about their childhood pastimes","w":"Lesson 2.6","y":"Students interview parents or grandparents about childhood pastimes, take notes on games played by family or neighbours, and discuss them in class.","u":"2A U2","r":"Students interview parents or grandparents about their childhood pastimes","uid":"TL|G3|2|2A|2"},{"t":"Hobbies: Students gather hobby information from five classmates for a news report","w":"Exercise 2.6","y":"Each student picks five classmates, collects what hobbies they have and the benefits gained, then uses it to write a news report.","u":"2A U2","r":"Students gather hobby information from five classmates for a news report","uid":"TL|G3|2|2A|2"},{"t":"Protecting the environment: Students look up answers to three questions on nature","w":"Activity 2","y":"Students search for answers to three set questions on nature and the environment, write them in the textbook and discuss in groups. The guide labels this lesson inquiry-based.","g":true,"u":"2A U3","r":"Students look up answers to three questions on nature","uid":"TL|G3|2|2A|3"},{"t":"Protecting the environment: Students find evidence of Singapore's green efforts","w":"Activity 3","y":"Students individually search for evidence that Changi Airport is green and for Singapore's efforts to protect the environment, then discuss in groups.","u":"2A U3","r":"Students find evidence of Singapore's green efforts","uid":"TL|G3|2|2A|3"}],"2":[{"t":"Interview: Finding out a school community member's story first-hand","y":"Students interview a real person live in Tamil, ask their own questions and make sense of the replies to build the article. They find out first-hand.","aa":true,"u":"Interview","r":"Finding out a school community member's story first-hand"},{"t":"Kings of Tamil Nadu: Students look up the kings in the pictures before class","w":"Pre-lesson task","y":"Before class, students search online for details of the kings shown in the opening pictures, then share their findings with the class.","u":"2A U4","r":"Students look up the kings in the pictures before class","uid":"TL|G3|2|2A|4"},{"t":"Yesterday, today, tomorrow: Groups work out a text's main idea and compare three texts","w":"Lesson 1.8","y":"Groups read their own text, find its main idea and the clues, then read two others and compare. The guide labels this the 5E inquiry method. Texts only.","g":true,"u":"2B U1","r":"Groups work out a text's main idea and compare three texts","uid":"TL|G3|2|2B|1"},{"t":"Yesterday, today, tomorrow: Groups collect data on old and electronic games","w":"Lesson 1.5","y":"Groups use their own devices to collect data on three questions about traditional and electronic games, including pros and cons for young people.","u":"2B U1","r":"Groups collect data on old and electronic games","uid":"TL|G3|2|2B|1"}],"3":[{"t":"Financial literacy: Groups read chosen texts, explain main ideas and point to clues","w":"Exercise 2.1","y":"Groups pick texts from nine on financial literacy, explain each main idea and point to the clues that showed it. The guide names this the 5E inquiry method.","g":true,"u":"2B U2","r":"Groups read chosen texts, explain main ideas and point to clues","uid":"TL|G3|2|2B|2"}]},"Conclusion":{"2":[{"t":"Video and reflection: Sharing the story found and reflecting on it","y":"Groups share what they found in a recorded presentation and write an individual reflection in class on the project.","aa":true,"u":"Video and reflection","r":"Sharing the story found and reflecting on it"},{"t":"Yesterday, today, tomorrow: Groups share findings, answer questions and are evaluated","w":"Lesson 1.8","y":"Groups share what they found with the class, others ask questions, and classmates and teacher assess the work against a rubric. This is the 5E method.","g":true,"u":"2B U1","r":"Groups share findings, answer questions and are evaluated","uid":"TL|G3|2|2B|1"},{"t":"Yesterday, today, tomorrow: Groups read and comment on other groups' entries","w":"Lesson 1.5","y":"After groups post their views on games, other groups read them and respond with comments, and the teacher pulls the ideas together.","u":"2B U1","r":"Groups read and comment on other groups' entries","uid":"TL|G3|2|2B|1"}],"1":[{"t":"Protecting the environment: Groups share findings and answer classmates' questions","w":"Activity 2","y":"Groups share what they gathered on recycling and green efforts. Classmates comment and ask questions, and the group explains its findings.","u":"2A U3","r":"Groups share findings and answer classmates' questions","uid":"TL|G3|2|2A|3"}],"3":[{"t":"Financial literacy: Groups share with the class and peers question them","w":"Exercise 2.1","y":"Groups share their discussion with the class and others ask questions to clear doubts. Follows the 5E inquiry method named in the guide.","g":true,"u":"2B U2","r":"Groups share with the class and peers question them","uid":"TL|G3|2|2B|2"}]},"Conceptualisation":{"1":[{"t":"Friendship: Students state agree or disagree on friendship ideas before reading","w":"Lesson 1.3","y":"Before reading, students mark whether they agree with ideas about friendship, then check the text, cite the page and explain if their stance holds. One text only, so modest.","u":"2A U1","r":"Students state agree or disagree on friendship ideas before reading","uid":"TL|G3|2|2A|1"}]},"Orientation":{"1":[{"t":"Protecting the environment: Students answer an open question on nature's gifts","w":"Pre-lesson task","y":"Before class, students answer on a shared board what gifts nature has given us; the lesson then builds on the answers in group work on a poem. The guide labels this inquiry-based.","g":true,"u":"2A U3","r":"Students answer an open question on nature's gifts","uid":"TL|G3|2|2A|3"}]}},"pos":{"Relationships":{"1":[{"t":"Friendship: Pairs practise repairing a hurt, advising and praising a friend","w":"Language game","y":"Pairs act out telling a friend they felt hurt and hearing the reply, advising a friend who erred and praising a friend's good deed.","u":"2A U1","r":"Pairs practise repairing a hurt, advising and praising a friend","uid":"TL|G3|2|2A|1"}]},"Accomplishment":{"3":[{"t":"Youth and society: Students reflect on the unit and get one-to-one feedback","w":"Lesson 3.12","y":"Students write what they make of their learning in the unit, share it, and then get individual feedback from the teacher on what to work towards.","u":"2B U3","r":"Students reflect on the unit and get one-to-one feedback","uid":"TL|G3|2|2B|3"}],"2":[{"t":"Newspaper article: Drafting, peer editing and reflecting","y":"Groups draft the article, peer-edit it and revise before submission, then each writes an individual reflection on the work.","aa":true,"u":"Newspaper article","r":"Drafting, peer editing and reflecting"},{"t":"Kings of Tamil Nadu: Pairs improve their circular after class comments","w":"Exercise 4.6","y":"After classmates comment on a circular, the pair rewrites it and hands in an improved version.","lm":[2],"u":"2A U4","r":"Pairs improve their circular after class comments","uid":"TL|G3|2|2A|4"}],"1":[{"t":"Friendship: Groups improve their vlog plan after class and teacher comments","w":"Lesson 1.10","y":"Groups design vlog content, share it, hear classmates' comments and the teacher's improvement points, then refine their work.","lm":[2],"u":"2A U1","r":"Groups improve their vlog plan after class and teacher comments","uid":"TL|G3|2|2A|1"}]},"Engagement":{"2":[{"t":"Newspaper article: Choosing an interviewee and making an own product","y":"Groups choose their own interviewee from the school community and make a newspaper article and video that they own.","aa":true,"u":"Newspaper article","r":"Choosing an interviewee and making an own product"}],"1":[{"t":"Friendship: Students choose how to record their own thinking about friendship","w":"Activity 2","y":"Students pick their own form for their thoughts on friendship (a word, phrase, slogan, poem or picture), then share it with the class.","lm":[4],"u":"2A U1","r":"Students choose how to record their own thinking about friendship","uid":"TL|G3|2|2A|1"}],"3":[{"t":"Financial literacy: Students choose three of nine financial texts to read","w":"Pre-lesson task","y":"Students choose which three of nine financial-literacy texts to read before class and join the matching group.","lm":[4],"u":"2B U2","r":"Students choose three of nine financial texts to read","uid":"TL|G3|2|2B|2"}]}},"full":[]},"TL|G3|3":{"terms":{"1":"The arts · Me and my relationships · Leadership qualities · WA1","2":"Living in harmony with nature · The Tamil way of life · WA2 · Oral","3":"Mental well-being · Tamil and the world · AA","4":"End-of-year preparation (first 2 weeks) · End-of-year exam"},"e21":{"CAIT 3":{"1":[{"t":"Leadership qualities: Students compare ideas in a reading with what happens today","w":"Lesson 3.5","y":"A stated lesson aim: students compare the ideas in a reading with present-day practice and comment. No change of view is required, so partial at this level.","u":"U3","r":"Students compare ideas in a reading with what happens today","uid":"TL|G3|3||3"},{"t":"The arts: Students compare old and modern paintings, then picture what comes next","w":"Activity 4","y":"Students state similarities and differences between old and today's paintings, then predict what follows digital art. Only partly links the comparison to a changed view.","u":"U1","r":"Students compare old and modern paintings, then picture what comes next","uid":"TL|G3|3||1"}],"2":[{"t":"The Tamil way of life: Students compare Tamils' service in a reading with today's news","w":"Lesson 5.4","y":"Students bring news on the community service of Tamils today and compare the ideas in a reading with present-day practice. Partial at this level.","u":"U5","r":"Students compare Tamils' service in a reading with today's news","uid":"TL|G3|3||5"},{"t":"The Tamil way of life: Students compare ancient values with how they are followed today","w":"Activity 2","y":"Students link old values to present-day life through a viewpoints routine; the comparison is stated, but how it changes their view is not.","u":"U5","r":"Students compare ancient values with how they are followed today","uid":"TL|G3|3||5"}],"3":[{"t":"Mental well-being: Students compare ideas in a letter with what happens today","w":"Lesson 6.4","y":"A stated lesson aim: students compare a letter's ideas on kind and proud minds with present-day practice and comment. No change of view is required.","u":"U6","r":"Students compare ideas in a letter with what happens today","uid":"TL|G3|3||6"}]},"CAIT 4":{"1":[{"t":"Me and my relationships: Students plan a family get-together for a given situation","w":"Activity 2","y":"Students apply what they learnt to plan a family gathering that fits a set situation and justify the plan to the class. Partial at this level.","u":"U2","r":"Students plan a family get-together for a given situation","uid":"TL|G3|3||2"}],"3":[{"t":"Tamil and the world: Students plan a programme for an event they choose","w":"Lesson 7.9","y":"Students pick an event, plan its programme and write the host's speech, applying what they learnt to a new occasion. Partial at this level.","u":"U7","r":"Students plan a programme for an event they choose","uid":"TL|G3|3||7"}]},"CGC 1":{"1":[{"t":"The arts: Students respond to information on the Singapore Youth Festival","w":"Exercise 1.2","y":"Students read about the Singapore Youth Festival, answer with See-Think-Wonder and react to peers' views with reasons. Only partly about an issue for Singapore.","u":"U1","r":"Students respond to information on the Singapore Youth Festival","uid":"TL|G3|3||1"}],"2":[{"t":"Living in harmony with nature: Students discuss Singapore's five-year green plan","w":"Lesson 4.2","y":"Students discuss the steps Singapore will take on its green plan over the next five years. One account of the issue, so partial at this level.","u":"U4","r":"Students discuss Singapore's five-year green plan","uid":"TL|G3|3||4"},{"t":"Living in harmony with nature: Students think of other ways to raise green awareness","w":"Lesson 4.3","y":"After reading how nature is cared for in Singapore, students think through and discuss what else could raise awareness and protect greenery.","u":"U4","r":"Students think of other ways to raise green awareness","uid":"TL|G3|3||4"}],"3":[{"t":"Debate: Arguing for or against a set question on culture in Singapore","y":"Students argue for or against a set question on culture in Singapore, with both sides heard. Partial at Level 4: the tension is aired, not worked through.","aa":true,"u":"Debate","r":"Arguing for or against a set question on culture in Singapore"}]},"CCI 1":{"2":[{"t":"Oral exam: Answering examiner questions on a video","y":"After a short video, students answer examiner questions: their reaction or experience, what they suggest, and whether they agree with a given view, giving reasons. Spoken, with the examiner.","u":"Oral exam","r":"Answering examiner questions on a video"}],"3":[{"t":"Debate speech: Arguing a position with reasons and evidence","y":"Students prepare and deliver a debate speech of about 2 to 3 minutes with reasons and evidence, and rebut the other side. Spoken to a class audience.","aa":true,"u":"Debate speech","r":"Arguing a position with reasons and evidence"},{"t":"Mental well-being: Two teams may debate whether social media wastes students' time","w":"Exercise 6.9","y":"Teams argue opposite sides on social media and time use. The guide offers this as an option alongside a written argument essay.","u":"U6","r":"Two teams may debate whether social media wastes students' time","uid":"TL|G3|3||6"},{"t":"Tamil and the world: Students write and deliver a host's speech for an event","w":"Exercise 7.8","y":"Students write and present a programme host's speech for an event they choose, following the writing tips. One-way to a class audience.","u":"U7","r":"Students write and deliver a host's speech for an event","uid":"TL|G3|3||7"}],"1":[{"t":"The arts: Students agree or disagree with peers' posts and give reasons","w":"Lessons 1.4 to 1.5","y":"On a class board, students react to classmates' views by agreeing with reasons, disagreeing with reasons, or replying.","u":"U1","r":"Students agree or disagree with peers' posts and give reasons","uid":"TL|G3|3||1"},{"t":"Me and my relationships: Teams debate after choosing a stance and refining arguments","w":"Exercise 2.7","y":"Students choose a stance, join a team, gather and refine arguments, then debate in class with teacher feedback. Stated position and audience.","u":"U2","r":"Teams debate after choosing a stance and refining arguments","uid":"TL|G3|3||2"},{"t":"Leadership qualities: Students rank qualities and may change after hearing others","w":"Activity 1","y":"Students rank nine leadership qualities, give reasons, listen to classmates' reasons and may change their ranking, saying why.","u":"U3","r":"Students rank qualities and may change after hearing others","uid":"TL|G3|3||3"},{"t":"Leadership qualities: Students write a short speech and deliver it to the class","w":"Exercise 3.7","y":"Students study the features of a short speech, write one for a given occasion and deliver it. One-way, to a class audience.","u":"U3","r":"Students write a short speech and deliver it to the class","uid":"TL|G3|3||3"}]},"CCI 3":{"1":[{"t":"The arts: Pairs, then fours, then the class decide why folk arts must be preserved","w":"Pyramid discussion","y":"Pairs trade at least three views, agree or disagree with evidence, then fours reach a decision and the whole class settles on reasons together.","u":"U1","r":"Pairs, then fours, then the class decide why folk arts must be preserved","uid":"TL|G3|3||1"}],"2":[{"t":"The Tamil way of life: Groups agree one view on how old values live on today","w":"Activity 2","y":"Group members each give a view on harmony, charity or hospitality today, discuss and must reach one agreed view before sharing with the class.","u":"U5","r":"Groups agree one view on how old values live on today","uid":"TL|G3|3||5"}]},"CCI 2":{"3":[{"t":"Mental well-being: Groups respond to a person's decision in a written case","w":"Activity 1","y":"Groups write three thoughts on a person's decision, two messages to say to them and a title, then answer classmates' questions. A written case, not a real person.","u":"U6","r":"Groups respond to a person's decision in a written case","uid":"TL|G3|3||6"}]}},"ibl":{"Conceptualisation":{"1":[{"t":"The arts: Students note what they know, what puzzles them and what to explore","w":"Activity 2","y":"Before class, students record what they know about paintings, what puzzles them and what they want to find out, then react to peers' posts.","u":"U1","r":"Students note what they know, what puzzles them and what to explore","uid":"TL|G3|3||1"},{"t":"Me and my relationships: Students write their own questions about relationships first","w":"Paired questioning","y":"Students individually jot the questions that occur to them about relationships, then put them to a partner. The questions come from the students.","u":"U2","r":"Students write their own questions about relationships first","uid":"TL|G3|3||2"}],"2":[{"t":"Living in harmony with nature: Students list what they know and want to know on greenery","w":"KWL","y":"Using a KWL chart, students write what they know and what they want to know about green Singapore from pictures and share it.","u":"U4","r":"Students list what they know and want to know on greenery","uid":"TL|G3|3||4"}],"3":[{"t":"Mental well-being: Students list wh
